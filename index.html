// availHPreZoom: overlay height before zoom
function _renderPanelHtml(panelData, colorMap, availHPreZoom) {
  if (!panelData || !panelData.length) return '';
  const numGroups = panelData.length;
  const hdrH = 14;
  const totalMembers = panelData.reduce((s, g) => s + g.members.length, 0);
  // MIN_CARD：最小可讀高度；MAX_CARD：人少時避免卡片過大
  const MIN_CARD = 22, MAX_CARD = 70;
  const cardH = Math.max(MIN_CARD, Math.min(MAX_CARD, Math.floor((availHPreZoom - numGroups * hdrH) / totalMembers)));
  return panelData.map(({spec, members}) => {
    const bc = colorMap[spec] || '#888';
    return `<div>
      <div style="height:${hdrH}px;display:flex;align-items:center;font-size:7.5px;font-weight:900;color:white;padding:0 5px;border-radius:2px;background:${bc};margin-bottom:0;">${_escH(spec)}</div>
      ${members.map((m, i) => _dmCardNew(m, colorMap[m.industry||m.specialty||'其他']||bc, cardH, i === members.length - 1)).join('')}
    </div>`;
  }).join('');
}

async function renderDM() {
  // 預先背景載入 PDF 函式庫，避免匯出時有延遲
  _loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
  _loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');

  const el = document.getElementById('dmContent');
  el.innerHTML = `<div style="text-align:center;padding:48px 20px;color:var(--text-soft);">載入中...</div>`;
  if (!_memberData) await fetchMembers();
  if (!_memberData) { el.innerHTML = `<div style="text-align:center;padding:48px 20px;color:var(--red);">載入失敗，請重試</div>`; return; }

  const { panels, colorMap } = _dmDistribute();
  // px/mm 換算比例
  const PX_H = 225 / 105; // 水平：面板225px = 105mm
  const PX_V = 636 / 297; // 垂直：畫布636px = 297mm
  const RED_TOP = Math.round(636 - 21.8 * PX_V); // P1-2 紅色禁區上界 ≈ 589px
  // 各面板邊距設定 (mm)：[left, right, top, bottom]
  const MG = [
    [10, 5,  10, 10], // P1
    [5,  5,  10, 10], // P2
    [10, 5,  10, 10], // P5
    [5,  5,  10, 10], // P6
    [5,  5,  10, 10], // P7
    [5,  10, 10, 10], // P8
  ];
  const dividers = [25,50,75].map(p=>`<div style="position:absolute;left:${p}%;top:0;width:1px;height:100%;background:rgba(0,0,0,0.15);z-index:5;"></div>`).join('');
  // pi: panel index(0-5), xi: x位置(0-3), isP12: 是否為P1-2面板
  const ov = (pi, xi, isP12) => {
    const [lmm, rmm, tmm, bmm] = MG[pi];
    const lPx = Math.round(lmm * PX_H);
    const rPx = Math.round(rmm * PX_H);
    const tPx = Math.round(tmm * PX_V);
    const bPx = Math.round(bmm * PX_V);
    const z   = isP12 ? 1.1 : 1.0;
    const x   = xi * 225 + lPx;
    const w   = 225 - lPx - rPx;
    const botY = isP12 ? Math.min(636 - bPx, RED_TOP) : (636 - bPx);
    const h   = botY - tPx;
    const preZW = Math.round(w / z);
    const preZH = Math.round(h / z);
    return `<div style="position:absolute;left:${x}px;top:${tPx}px;width:${w}px;height:${h}px;overflow:visible;outline:1.5px dashed rgba(192,57,43,0.45);outline-offset:-1px;z-index:10;">
      <div style="width:${preZW}px;zoom:${z};">
        ${_renderPanelHtml(panels[pi], colorMap, preZH)}
      </div>
    </div>`;
  };

  el.innerHTML = `<div class="dm-wrapper">
    <div class="card" style="margin-bottom:14px;padding:16px 20px;">
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;">
        <div>
          <div style="font-size:16px;font-weight:900;color:var(--text);">會員 DM</div>
          <div style="font-size:12px;color:var(--text-soft);margin-top:3px;">共 ${_memberData.length} 位會員</div>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn btn-primary" onclick="printDM()">匯出 PDF</button>
          <button class="btn" style="background:white;border:1.5px solid var(--gray-border);color:var(--text-soft);" onclick="renderDM()">換一種排法</button>
        </div>
      </div>
    </div>

    <div class="dm-panel-label">正面 A3（Page 1–4，左→右）</div>
    <div class="dm-scale-outer" id="dmOuter1">
      <div class="dm-bg-wrap" id="dmSide1">
        <img style="position:absolute;left:0;top:0;width:25%;height:100%;object-fit:fill;display:block;" src="dm_p1.png" alt="">
        <img style="position:absolute;left:25%;top:0;width:25%;height:100%;object-fit:fill;display:block;" src="dm_p2.png" alt="">
        <img style="position:absolute;left:50%;top:0;width:25%;height:100%;object-fit:fill;display:block;" src="dm_p3.png" alt="">
        <img style="position:absolute;left:75%;top:0;width:25%;height:100%;object-fit:fill;display:block;" src="dm_p4.png" alt="">
        ${dividers}
        ${ov(0,0,true)}${ov(1,1,true)}
      </div>
    </div>

    <div class="dm-panel-label" style="margin-top:16px;">背面 A3（Page 5–8，左→右）</div>
    <div class="dm-scale-outer" id="dmOuter2">
      <div class="dm-bg-wrap" id="dmSide2">
        <img style="position:absolute;left:0;top:0;width:25%;height:100%;object-fit:fill;display:block;" src="dm_p5.png" alt="">
        <img style="position:absolute;left:25%;top:0;width:25%;height:100%;object-fit:fill;display:block;" src="dm_p6.png" alt="">
        <img style="position:absolute;left:50%;top:0;width:25%;height:100%;object-fit:fill;display:block;" src="dm_p7.png" alt="">
        <img style="position:absolute;left:75%;top:0;width:25%;height:100%;object-fit:fill;display:block;" src="dm_p8.png" alt="">
        ${dividers}
        ${ov(2,0,false)}${ov(3,1,false)}${ov(4,2,false)}${ov(5,3,false)}
      </div>
    </div>
  </div>`;
  _scaleDM();
}

function _loadScript(src) {
  return new Promise((res, rej) => {
    if (document.querySelector(`script[src="${src}"]`)) { res(); return; }
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
}

async function printDM() {
  if (!_memberData) return;
  showToast('PDF 產生中，請稍候...');

  try {
    await Promise.all([
      _loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'),
      _loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js')
    ]);
  } catch {
    showToast('載入失敗，請確認網路連線');
    return;
  }

  const { panels, colorMap } = _dmDistribute();
  const base = location.origin + location.pathname.replace(/[^/]*$/, '');

  const MG = [
    [10, 5,  10, 10],
    [5,  5,  10, 10],
    [10, 5,  10, 10],
    [5,  5,  10, 10],
    [5,  5,  10, 10],
    [5,  10, 10, 10],
  ];
  const RED_MM = 297 - DM_RED_MM;
  const HDR_MM = +(14 * PX2MM).toFixed(2);
  const MIN_CARD_MM = +(30 * PX2MM).toFixed(2);

  const pCard = (m, bc, rendCardH_mm, z, isLast) => {
    const preZCardH = rendCardH_mm / z;
    const psPre = Math.max(22 * PX2MM + 2, Math.min(36 * PX2MM, preZCardH - 8 * PX2MM)) + 4;
    const psMm     = +(psPre * z).toFixed(2);
    const nameMm   = +(8.5 * PX2MM * z).toFixed(2);
    const spMm     = +(6.5 * PX2MM * z).toFixed(2);
    const smMm     = +(7   * PX2MM * z).toFixed(2);
    const gapMm    = +(4   * PX2MM * z).toFixed(2);
    const borderMm = +(2   * PX2MM * z).toFixed(2);
    const padMm    = +(2   * PX2MM * z).toFixed(2);
    const ph = m.photo
      ? `<img style="width:${psMm}mm;height:${psMm}mm;border-radius:50%;object-fit:cover;flex-shrink:0;border:${borderMm}mm solid ${bc};display:block;" src="${_escH(m.photo)}" crossorigin="anonymous" onerror="this.style.display='none'">`
      : `<div style="width:${psMm}mm;height:${psMm}mm;border-radius:50%;flex-shrink:0;border:${borderMm}mm solid ${bc};background:#e8ecf0;display:flex;align-items:center;justify-content:center;color:#bbb;font-size:${+(psMm*0.3).toFixed(2)}mm;font-weight:900;">?</div>`;
    return `<div style="display:flex;gap:${gapMm}mm;align-items:center;${isLast?'':'border-bottom:1pt solid rgba(0,0,0,0.07);'}min-height:${rendCardH_mm}mm;box-sizing:border-box;padding:${padMm}mm ${padMm}mm;">
      <div style="display:flex;align-items:center;flex-shrink:0;">${ph}</div>
      <div style="flex:1;min-width:0;">
        <div style="display:flex;align-items:baseline;gap:${+(1.5*PX2MM*z).toFixed(2)}mm;justify-content:space-between;">
          <span style="font-size:${nameMm}mm;font-weight:900;color:#1a1a2e;line-height:1.2;">${_escH(m.name)}</span>
          ${m.specialty?`<span style="font-size:${spMm}mm;font-weight:700;color:${bc};flex-shrink:0;">${_escH(m.specialty)}</span>`:''}
        </div>
        ${m.company?`<div style="font-size:${smMm}mm;color:#777;line-height:1.2;word-break:break-all;">${_escH(m.company)}</div>`:''}
        ${m.phone?`<div style="font-size:${smMm}mm;color:#555;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${_escH(m.phone)}</div>`:''}
        ${m.service?`<div style="font-size:${smMm}mm;font-weight:700;color:#222;line-height:1.25;">${_fmtService(m.service)}</div>`:''}
      </div>
    </div>`;
  };

  const pPanel = (pi, hMm, z) => {
    if (!panels[pi] || !panels[pi].length) return '';
    const numGroups = panels[pi].length;
    const totalMembers = panels[pi].reduce((s, g) => s + g.members.length, 0);
    const preZH = hMm / z;
    const MAX_CARD_MM = 70 * PX2MM;
    const cardH = Math.max(MIN_CARD_MM, Math.min(MAX_CARD_MM, Math.floor((preZH - numGroups * HDR_MM) / totalMembers * 10) / 10));
    const rendHdr  = +(HDR_MM * z).toFixed(2);
    const rendCard = +(cardH  * z).toFixed(2);
    const hdrFontMm = +(7.5 * PX2MM * z).toFixed(2);
    return panels[pi].map(({spec, members}) => {
      const bc = colorMap[spec] || '#888';
      return `<div>
        <div style="height:${rendHdr}mm;display:flex;align-items:center;font-size:${hdrFontMm}mm;font-weight:900;color:white;padding:0 ${+(2*PX2MM*z).toFixed(2)}mm;border-radius:0.5mm;background:${bc};">${_escH(spec)}</div>
        ${members.map((m, i) => pCard(m, colorMap[m.industry||m.specialty||'其他']||bc, rendCard, z, i === members.length - 1)).join('')}
      </div>`;
    }).join('');
  };

  const ovP12 = (pi, xi) => {
    const [lmm, rmm, tmm] = MG[pi];
    const x = xi * 105 + lmm;
    const w = 105 - lmm - rmm;
    const h = +(Math.min(297 - MG[pi][3], RED_MM) - tmm).toFixed(2);
    return `<div style="position:absolute;left:${x}mm;top:${tmm}mm;width:${w}mm;height:${h}mm;overflow:hidden;">${pPanel(pi, h, 1.1)}</div>`;
  };
  const ovP58 = (pi, xi) => {
    const [lmm, rmm, tmm, bmm] = MG[pi];
    const x = xi * 105 + lmm;
    const w = 105 - lmm - rmm;
    const h = +(297 - tmm - bmm).toFixed(2);
    return `<div style="position:absolute;left:${x}mm;top:${tmm}mm;width:${w}mm;height:${h}mm;overflow:hidden;">${pPanel(pi, h, 1.0)}</div>`;
  };
  const bg = (n, xmm) => `<img style="position:absolute;left:${xmm}mm;top:0;width:105mm;height:297mm;object-fit:fill;display:block;" src="${base}dm_p${n}.png" crossorigin="anonymous">`;

  const pages = [
    `${bg(1,0)}${bg(2,105)}${bg(3,210)}${bg(4,315)}${ovP12(0,0)}${ovP12(1,1)}`,
    `${bg(5,0)}${bg(6,105)}${bg(7,210)}${bg(8,315)}${ovP58(2,0)}${ovP58(3,1)}${ovP58(4,2)}${ovP58(5,3)}`
  ];

  // 建立隱藏渲染容器
  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:absolute;left:-9999px;top:0;';
  const pageEl = document.createElement('div');
  pageEl.style.cssText = "position:relative;width:420mm;height:297mm;overflow:hidden;background:white;font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;";
  wrap.appendChild(pageEl);
  document.body.appendChild(wrap);

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a3', compress: true });

  try {
    for (let i = 0; i < 2; i++) {
      pageEl.innerHTML = pages[i];
      // 等待所有圖片載入
      await Promise.all([...pageEl.querySelectorAll('img')].map(img =>
        img.complete ? Promise.resolve() :
        new Promise(r => { img.onload = r; img.onerror = r; })
      ));
      const canvas = await html2canvas(pageEl, {
        scale: 2,
        useCORS: true,
        allowTaint: false,
        logging: false,
        backgroundColor: '#ffffff'
      });
      if (i > 0) doc.addPage();
      doc.addImage(canvas.toDataURL('image/jpeg', 0.85), 'JPEG', 0, 0, 420, 297);
    }
    doc.save('BNI-億展分會-會員名錄.pdf');
    showToast('PDF 已下載');
  } catch {
    showToast('PDF 產生失敗，請重試');
  } finally {
    document.body.removeChild(wrap);
  }
}

// ===== SIGNIN SHEET =====
const SIGNIN_ROWS_PER_PAGE = 15;     // 會員每頁人數
const SIGNIN_GUEST_PER_PAGE = 10;    // 來賓每頁人數
const SIGNIN_GUEST_TOTAL    = 10;    // 來賓總人數
let _signinSubTab = 'member';       // 'member' | 'guest'
let _signinDate = '';                // 'YYYY-MM-DD'，預設今天

function _rocDateText(isoDate) {
  const d = isoDate ? new Date(isoDate + 'T00:00:00') : new Date();
  const roc = d.getFullYear() - 1911;
  const m   = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${roc} 年 ${m} 月 ${day} 日`;
}
function _todayIso() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

async function renderSignin() {
  _loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
  _loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');

  const el = document.getElementById('signinContent');
  el.innerHTML = `<div style="text-align:center;padding:48px 20px;color:var(--text-soft);">載入中...</div>`;
  if (!_memberData) await fetchMembers();
  if (!_memberData) { el.innerHTML = `<div style="text-align:center;padding:48px 20px;color:var(--red);">載入失敗，請重試</div>`; return; }
  // 來賓簽到表需要本周來賓資料
  if (_signinSubTab === 'guest' && _guestData === null) await fetchGuests();

  if (!_signinDate) _signinDate = _todayIso();
  const dateText = _rocDateText(_signinDate);
  const tab = _signinSubTab;
  const subBtn = (v, label) => `<button class="signin-subtab ${tab===v?'active':''}" onclick="_signinSwitch('${v}')">${label}</button>`;
  const sheetsHtml = tab === 'member' ? _buildMemberSheets(dateText) : _buildGuestSheets(dateText);
  const pageCount = (sheetsHtml.match(/class="signin-sheet"/g) || []).length;
  const weekGuestCount = tab === 'guest' ? _getWeekGuestsForSignin().length : 0;
  const desc = tab === 'member'
    ? `共 ${_memberData.length} 位會員 · ${pageCount} 張 A4（每張 ${SIGNIN_ROWS_PER_PAGE} 人）`
    : `本周 ${weekGuestCount} 位 · 表格 ${SIGNIN_GUEST_TOTAL} 格 · ${pageCount} 張 A4`;

  el.innerHTML = `<div class="signin-wrapper">
    <div class="card" style="margin-bottom:14px;padding:16px 20px;">
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;">
        <div>
          <div style="font-size:16px;font-weight:900;color:var(--text);">出席簽到</div>
          <div style="font-size:12px;color:var(--text-soft);margin-top:3px;">A4 直式 · ${desc}</div>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
          <label style="font-size:13px;color:var(--text-soft);font-weight:600;">日期</label>
          <input type="date" value="${_signinDate}" onchange="_signinSetDate(this.value)" style="padding:8px 10px;border:1.5px solid var(--gray-border);border-radius:var(--radius-sm);font-family:inherit;font-size:13px;outline:none;">
          <button class="btn btn-primary" onclick="printSignin()">匯出 PDF</button>
        </div>
      </div>
      <div style="display:flex;gap:8px;margin-top:14px;">
        ${subBtn('member','會員')}
        ${subBtn('guest','來賓')}
      </div>
    </div>
    <div class="signin-preview-outer" id="signinOuter">
      <div class="signin-preview-inner" id="signinInner">
        ${sheetsHtml}
      </div>
    </div>
  </div>`;
  _scaleSignin();
}

function _signinSwitch(v) { _signinSubTab = v; renderSignin(); }
function _signinSetDate(v) { _signinDate = v || _todayIso(); renderSignin(); }

function _buildMemberSheets(dateText) {
  const members = [..._memberData];
  const chunks = [];
  for (let i = 0; i < members.length; i += SIGNIN_ROWS_PER_PAGE) {
    chunks.push(members.slice(i, i + SIGNIN_ROWS_PER_PAGE));
  }
  if (!chunks.length) chunks.push([]);
  return chunks.map((arr, pi) =>
    _memberSheetHtml(dateText, arr, pi * SIGNIN_ROWS_PER_PAGE, pi + 1, chunks.length)
  ).join('');
}

function _buildGuestSheets(dateText) {
  const total   = SIGNIN_GUEST_TOTAL;
  const perPage = SIGNIN_GUEST_PER_PAGE;
  const pages   = Math.max(1, Math.ceil(total / perPage));
  let html = '';
  for (let p = 0; p < pages; p++) {
    const start = p * perPage;
    const count = Math.min(perPage, total - start);
    html += _guestSheetHtml(dateText, start, count, p + 1, pages);
  }
  return html;
}

function _memberSheetHtml(dateText, members, startIdx, pageNum, totalPages) {
  const rowH = 14; // mm，每列 14mm 以容納 26pt 姓名
  const suffix = totalPages > 1 ? `（${pageNum}/${totalPages}）` : '';
  const rows = members.map((m, i) => `
    <tr style="height:${rowH}mm;">
      <td class="c-num">${startIdx + i + 1}</td>
      <td class="c-name">${_escH(m.name)}</td>
      <td></td>
      <td class="c-time">:</td>
      <td></td>
      <td></td>
    </tr>`).join('');
  return `<div class="signin-sheet">
    <div class="ss-title">BNI 億展白金分會　會員出席簽到${suffix}</div>
    <div class="ss-subtitle">${dateText}　　6:15 領導團隊應到　6:30 會員應到</div>
    <table class="ss-table">
      <colgroup>
        <col style="width:9%"><col style="width:17%"><col style="width:22%"><col style="width:16%"><col style="width:12%"><col style="width:24%">
      </colgroup>
      <thead><tr><th>序號</th><th>會員</th><th>簽名</th><th>簽到時間</th><th>收費</th><th>備註</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function _guestSheetHtml(dateText, startIdx, rowCount, pageNum, totalPages) {
  const rowH = 10; // mm，每個子列；每位來賓佔 2 子列 = 20mm
  const suffix = totalPages > 1 ? `（${pageNum}/${totalPages}）` : '';
  const weekGuests = _getWeekGuestsForSignin();
  let rows = '';
  for (let i = 1; i <= rowCount; i++) {
    const g = weekGuests[startIdx + i - 1]; // 對應本周來賓（若有）
    const infoText = g
      ? `${g.name || ''}${g.title ? ' ' + g.title : ''}${g.industry ? ' / ' + g.industry : ''}${g.inviter ? ' / ' + g.inviter : ''}`
      : '';
    const phoneText = g && g.phone ? `電話：${g.phone}` : '電話：';
    rows += `
      <tr style="height:${rowH}mm;">
        <td class="c-num" rowspan="2">${startIdx + i}</td>
        <td class="c-guest-info">${_escH(infoText)}</td>
        <td class="c-sig" rowspan="2"></td>
        <td class="c-check c-check-top">□　名　片</td>
      </tr>
      <tr style="height:${rowH}mm;">
        <td class="c-guest-phone">${_escH(phoneText)}</td>
        <td class="c-check c-check-bot">□　出席費</td>
      </tr>`;
  }
  return `<div class="signin-sheet">
    <div class="ss-title">BNI 億展白金分會　來賓出席簽到${suffix}</div>
    <div class="ss-subtitle">${dateText}</div>
    <table class="ss-table">
      <colgroup>
        <col style="width:8%"><col style="width:48%"><col style="width:20%"><col style="width:24%">
      </colgroup>
      <thead><tr><th>序號</th><th>姓名 / 產業別 / 邀請人</th><th>簽到</th><th>（由工作人員勾選）</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function _getWeekGuestsForSignin() {
  if (!_guestData) return [];
  const { mon, sun } = _weekRange();
  return _guestData.filter(g => {
    const d = _parseDateStr(g.firstVisit);
    return d && d >= mon && d <= sun;
  }).sort((a,b) => (a.firstVisit||'').localeCompare(b.firstVisit||''));
}

function _scaleSignin() {
  const outer = document.getElementById('signinOuter');
  const inner = document.getElementById('signinInner');
  if (!outer || !inner) return;
  const availW = outer.clientWidth;
  const baseW  = 794;  // 210mm @ 96dpi
  const scale  = Math.min(1, availW / baseW);
  inner.style.transform = `scale(${scale})`;
  inner.style.marginLeft = Math.max(0, (availW - baseW * scale) / 2) + 'px';
  // 高度以 scrollHeight（未縮放的實際高）× 縮放比例 計算
  outer.style.height = (inner.scrollHeight * scale) + 'px';
}
window.addEventListener('resize', () => { if (_activeTab === 'signin') _scaleSignin(); });

async function printSignin() {
  showToast('PDF 產生中，請稍候...');
  try {
    await Promise.all([
      _loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'),
      _loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js')
    ]);
  } catch { showToast('載入失敗，請確認網路連線'); return; }

  const sheets = document.querySelectorAll('#signinInner .signin-sheet');
  if (!sheets.length) return;

  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:absolute;left:-9999px;top:0;background:white;';
  document.body.appendChild(wrap);

  try {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4', compress: true });
    for (let i = 0; i < sheets.length; i++) {
      wrap.innerHTML = '';
      const clone = sheets[i].cloneNode(true);
      clone.style.boxShadow = 'none';
      clone.style.marginTop = '0';
      wrap.appendChild(clone);
      const canvas = await html2canvas(clone, {
        scale: 2, useCORS: true, allowTaint: false, logging: false, backgroundColor: '#ffffff'
      });
      if (i > 0) doc.addPage();
      doc.addImage(canvas.toDataURL('image/jpeg', 0.9), 'JPEG', 0, 0, 210, 297);
    }
    const fn = _signinSubTab === 'member'
      ? `BNI-億展分會-會員出席簽到-${_signinDate}.pdf`
      : `BNI-億展分會-來賓出席簽到-${_signinDate}.pdf`;
    doc.save(fn);
    showToast('PDF 已下載');
  } catch {
    showToast('PDF 產生失敗，請重試');
  } finally {
    document.body.removeChild(wrap);
  }
}

const GUEST_STATUSES = ['待追蹤','持續追蹤','已填單待繳費','婉拒/停止追蹤'];
const GUEST_STATUS_COLORS = {
  '待追蹤':         { bg:'#f4f6f8', fg:'#666' },
  '持續追蹤':       { bg:'#fef3c7', fg:'#92400e' },
  '已填單待繳費':   { bg:'#fde68a', fg:'#78350f' },
  '婉拒/停止追蹤':  { bg:'#fee2e2', fg:'#991b1b' }
};
const JOIN_PROBABILITIES = ['未評估','高'];
const JOIN_PROB_COLORS = {
  '未評估': { bg:'#f4f6f8', fg:'#999' },
  '高':     { bg:'#fee2e2', fg:'#991b1b' }
};
let _guestData = null;
let _guestSubTab = 'week';   // 'week' | 'all'
let _guestSearch = '';
let _guestStatusFilter = ''; // '' = 全部，否則為特定狀態
let _guestTermFilter = 0;    // 0 = 全部，否則為特定屆數（1, 2, 3, ...）

function _parseDateStr(s) {
  if (!s) return null;
  s = String(s).trim();
  let m = s.match(/^(\d{4})[-\/\.](\d{1,2})[-\/\.](\d{1,2})/);
  if (m) return new Date(+m[1], +m[2]-1, +m[3]);
  m = s.match(/^(\d{4})年\s*(\d{1,2})月\s*(\d{1,2})/);
  if (m) return new Date(+m[1], +m[2]-1, +m[3]);
  m = s.match(/^(\d{2,3})年\s*(\d{1,2})月\s*(\d{1,2})/);
  if (m) return new Date(+m[1] + 1911, +m[2]-1, +m[3]);
  const d = new Date(s);
  return isNaN(d.getTime()) ? null : d;
}

function _weekRange() {
  const now = new Date();
  const dow = now.getDay();
  const offset = dow === 0 ? -6 : 1 - dow;
  const mon = new Date(now); mon.setHours(0,0,0,0); mon.setDate(now.getDate() + offset);
  const sun = new Date(mon); sun.setDate(mon.getDate() + 6); sun.setHours(23,59,59,999);
  return { mon, sun };
}

function _weekRangeText() {
  const { mon, sun } = _weekRange();
  const fmt = d => `${d.getMonth()+1}/${d.getDate()}`;
  return `${fmt(mon)} ~ ${fmt(sun)}`;
}

function _parseTracks(s) {
  if (!s) return [];
  try {
    const arr = typeof s === 'string' ? JSON.parse(s) : s;
    return Array.isArray(arr) ? arr.filter(x => x && x.note) : [];
  } catch { return []; }
}

function _guestLatestDate(g) {
  const tracks = _parseTracks(g.tracks);
  const dates = [_parseDateStr(g.firstVisit)];
  tracks.forEach(t => dates.push(_parseDateStr(t.date)));
  const valid = dates.filter(d => d);
  return valid.length ? new Date(Math.max(...valid.map(d => d.getTime()))) : null;
}

const HIGH_POTENTIAL_KEY = '__highPotential__';
const HIGH_POTENTIAL_LABEL = '高機率入會';
function _isHighPotentialGuest(g) {
  return g.joinProb === '高';
}

async function fetchGuests() {
  try {
    const r = await fetch(API_URL + '?action=listGuests&t=' + Date.now());
    const j = await r.json();
    if (!j || j.ok !== true) throw new Error(j?.error || 'fetch failed');
    _guestData = j.data || [];
  } catch (e) {
    _guestData = null;
  }
}

async function renderGuestTrack() {
  const el = document.getElementById('guestTrackContent');

  const statusCounts = _countByStatus(scopeFiltered);
  const guests = !_guestStatusFilter
    ? scopeFiltered
    : (_guestStatusFilter === HIGH_POTENTIAL_KEY
        ? scopeFiltered.filter(_isHighPotentialGuest)

  </div>`;
}

function _filterGuestsScope(tab, applyYear = true) {
  // 做 tab / 搜尋 / (可選)年份，不做狀態過濾
  if (!_guestData) return [];
  let list = [..._guestData];
  if (tab === 'all' && _guestSearch) {
    const q = _guestSearch.toLowerCase();
    list = list.filter(g =>
      (g.name||'').toLowerCase().includes(q) ||
      (g.industry||'').toLowerCase().includes(q) ||
      (g.inviter||'').toLowerCase().includes(q) ||
      (g.company||'').toLowerCase().includes(q)
    );
  }
  if (tab === 'all' && applyYear && _guestTermFilter) {
    list = list.filter(g => _getTermFromDate(g.firstVisit) === _guestTermFilter);
  }
  if (tab === 'week') {
    const { mon, sun } = _weekRange();
    list = list.filter(g => {
      const candidates = [_parseDateStr(g.firstVisit)];
      _parseTracks(g.tracks).forEach(t => candidates.push(_parseDateStr(t.date)));
      return candidates.some(d => d && d >= mon && d <= sun);
    });
  }
  list.sort((a,b) => {
    const da = _guestLatestDate(a); const db = _guestLatestDate(b);
    return (db ? db.getTime() : 0) - (da ? da.getTime() : 0);
  });
  return list;
}

// 屆數規則：第 1 屆 2024/2~2024/3（特例 2 個月），之後每 6 個月一屆，第 2 屆從 2024/4 開始
function _getTermFromDate(dateStr) {
  const d = dateStr instanceof Date ? dateStr : _parseDateStr(dateStr);
  if (!d) return null;
  const ym = d.getFullYear() * 12 + d.getMonth(); // 月份 0-based
  const term1Start = 2024 * 12 + 1; // 2024/02
  const term1End   = 2024 * 12 + 2; // 2024/03
  const term2Start = 2024 * 12 + 3; // 2024/04
  if (ym < term1Start) return null;
  if (ym <= term1End) return 1;
  return Math.floor((ym - term2Start) / 6) + 2;
}

function _getTermDateRange(term) {
  if (term === 1) {
    return { start: new Date(2024, 1, 1), end: new Date(2024, 2, 31, 23, 59, 59, 999) };
  }
  const startYM = 2024 * 12 + 3 + (term - 2) * 6;
  const endYM = startYM + 5;
  const startYear = Math.floor(startYM / 12);
  const startMonth = startYM % 12;
  const endYear = Math.floor(endYM / 12);
  const endMonth = endYM % 12;
  const endDay = new Date(endYear, endMonth + 1, 0).getDate();
  return {
    start: new Date(startYear, startMonth, 1),
    end:   new Date(endYear, endMonth, endDay, 23, 59, 59, 999)
  };
}

function _termLabel(term) {
  const r = _getTermDateRange(term);
  const fmt = d => `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}`;
  return `第${term}屆（${fmt(r.start)}~${fmt(r.end)}）`;
}

function _countByTerm(list) {
  const c = {};
  list.forEach(g => {
    const t = _getTermFromDate(g.firstVisit);
    if (t) c[t] = (c[t] || 0) + 1;
  });
  return c;
}

function _availableTerms() {
  if (!_guestData) return [];
  const set = new Set();
  _guestData.forEach(g => {
    const t = _getTermFromDate(g.firstVisit);
    if (t) set.add(t);
  });
  return [...set].sort((a,b) => b - a);
}

function _setTermFilter(t) {
  _guestTermFilter = (_guestTermFilter === t) ? 0 : t;
  renderGuestTrack();
}

function _countByStatus(list) {
  const c = {};
  list.forEach(g => {
    const s = g.status || '待追蹤';
    c[s] = (c[s] || 0) + 1;
  });
  return c;
}

function _statusSelectHtml() {
  // 狀態篩選的「每個選項計數」以「目前 tab + 搜尋 + 年份」為 scope，不套狀態本身
  const scope = _filterGuestsScope(_guestSubTab);
  const counts = _countByStatus(scope);
  const highCount = scope.filter(_isHighPotentialGuest).length;
  return `<select onchange="_setStatusFilter(this.value)" class="guest-filter-sel">
    <option value="" ${!_guestStatusFilter?'selected':''}>全部狀態・${scope.length} 筆</option>
    <option value="${HIGH_POTENTIAL_KEY}" ${_guestStatusFilter===HIGH_POTENTIAL_KEY?'selected':''}>${HIGH_POTENTIAL_LABEL}・${highCount} 筆</option>
    ${GUEST_STATUSES.map(s => `<option value="${s}" ${_guestStatusFilter===s?'selected':''}>${_escH(s)}・${counts[s]||0} 筆</option>`).join('')}
  </select>`;
}

function _termSelectHtml() {
  const scopeNoTerm = _filterGuestsScope(_guestSubTab, false);

    <option value="0" ${_guestTermFilter===0?'selected':''}>全部屆數・${scopeNoTerm.length} 筆</option>
    ${terms.map(t => `<option value="${t}" ${_guestTermFilter===t?'selected':''}>${_termLabel(t)}・${tCounts[t]||0} 筆</option>`).join('')}

}

function closeGuestModal() {

}

function _renderTracksList() {
  const c = document.getElementById('gm_tracksList');

  c.innerHTML = _guestModalTracks.map((t, i) => `

function _addTrackRow() {

// 邀約/締結人 自動提示（輸入才跳出、未打字不跳）
function _showMemberSuggest(inputId, value) {
  const box = document.getElementById(inputId + '_suggest');
  if (!box) return;
  const q = (value || '').trim().toLowerCase();
  if (!q || !_memberData || !_memberData.length) { box.style.display = 'none'; return; }
  const matches = _memberData.filter(m => m.name && m.name.toLowerCase().includes(q)).slice(0, 8);
  if (!matches.length) { box.style.display = 'none'; return; }
  box.innerHTML = matches.map(m =>
    `<div class="member-suggest-item" onmousedown="event.preventDefault();_selectMemberSuggest('${inputId}', this.textContent.trim())">${_escH(m.name)}</div>`
  ).join('');
  box.style.display = 'block';
}

function _hideMemberSuggest(inputId) {
  const box = document.getElementById(inputId + '_suggest');
  if (box) box.style.display = 'none';
}

function _selectMemberSuggest(inputId, name) {
  const inp = document.getElementById(inputId);
  if (inp) { inp.value = name; inp.focus(); }
  _hideMemberSuggest(inputId);
}

async function saveGuest(gKey) {
  const name = document.getElementById('gm_name').value.trim();
  if (!name) { showToast('請輸入姓名'); return; }
  const payload = {
    firstVisit:    document.getElementById('gm_firstVisit').value,
    inviter:       document.getElementById('gm_inviter').value.trim(),
    closer:        document.getElementById('gm_closer').value.trim(),
    name:          name,
    title:         document.getElementById('gm_title').value,
    industry:      document.getElementById('gm_industry').value.trim(),
    company:       document.getElementById('gm_company').value.trim(),
    phone:         document.getElementById('gm_phone').value.trim(),
    postVisitNote: document.getElementById('gm_postVisit').value.trim(),
    status:        document.getElementById('gm_status').value,
    joinProb:      document.getElementById('gm_joinProb').value,
    tracks:        JSON.stringify(_guestModalTracks.filter(t => t.note && t.note.trim()))
  };

  closeGuestModal();
  showToast(gKey ? '儲存中...' : '新增中...');

  try {
    if (gKey) {
      const [year, row] = gKey.split('-').map(Number);
      payload.action = 'updateGuest';
      payload.year = year;
      payload.sheetRow = row;
    } else {
      payload.action = 'addGuest';
    }
    await _apiPost(payload);
    _guestData = null;
    await renderGuestTrack();
    showToast(gKey ? '已儲存' : '已新增');
  } catch (e) {
    showToast('失敗，請重試');
  }
}

function deleteGuestConfirm(gKey) {
  const [year, row] = gKey.split('-').map(Number);
  const g = _guestData.find(x => x.year === year && x.sheetRow === row);
  if (!g) return;
  if (!confirm(`確定要刪除「${g.name}」？此動作無法還原。`)) return;
  _deleteGuest(year, row);
}

async function _deleteGuest(year, row) {
  showToast('刪除中...');
  try {
    await _apiPost({ action: 'deleteGuest', year, sheetRow: row });
    _guestData = null;
    await renderGuestTrack();
    showToast('已刪除');
  } catch {
    showToast('刪除失敗，請重試');
  }
}

// ===== 桌牌製作 =====
let _placardSubTab = 'guest';        // 'guest' | 'member'
let _placardMemberSelected = null;   // null = 全選；Set<sheetRow> = 自訂
let _placardMemberPanelOpen = false;

function _placardSwitch(v) { _placardSubTab = v; renderPlacard(); }

function _getSelectedMembers() {
  if (!_memberData) return [];
  if (_placardMemberSelected === null) return [..._memberData];
  return _memberData.filter(m => _placardMemberSelected.has(String(m.sheetRow)));
}

function _placardSelectAll() {
  _placardMemberSelected = null;
  document.querySelectorAll('.mplacard-selector-item input').forEach(cb => cb.checked = true);
  _placardRefreshMemberView();
}
function _placardSelectNone() {
  _placardMemberSelected = new Set();
  document.querySelectorAll('.mplacard-selector-item input').forEach(cb => cb.checked = false);
  _placardRefreshMemberView();
}
function _placardToggleMember(sheetRow) {
  const key = String(sheetRow);
  if (_placardMemberSelected === null) {
    _placardMemberSelected = new Set(_memberData.map(m => String(m.sheetRow)));
  }
  if (_placardMemberSelected.has(key)) _placardMemberSelected.delete(key);
  else _placardMemberSelected.add(key);
  _placardRefreshMemberView();
}
function _placardToggleSelectorPanel() {
  _placardMemberPanelOpen = !_placardMemberPanelOpen;
  const p = document.getElementById('mplacardPanel');
  const arrow = document.getElementById('mplacardSelArrow');
  if (p) p.style.display = _placardMemberPanelOpen ? '' : 'none';
  if (arrow) arrow.textContent = _placardMemberPanelOpen ? '▲' : '▼';
}

// 部分更新：不重建下拉選單面板，保留 scroll 位置
function _placardRefreshMemberView() {
  if (!_memberData) return;
  const sel   = _getSelectedMembers();
  const total = _memberData.length;
  const count = sel.length;
  const body  = document.getElementById('placardBody');
  if (body) body.innerHTML = _placardBodyHtml('member', [], sel);
  const desc  = document.getElementById('placardDesc');
  if (desc) desc.textContent = `已選 ${count} / ${total} 位 · ${Math.ceil(count/2)} 張 A4（每張 2 位，上下對摺為立牌）`;
  const btn   = document.getElementById('placardPdfBtn');
  if (btn) btn.disabled = count === 0;
  const selTx = document.getElementById('mplacardSelBtnText');
  if (selTx) selTx.textContent = `選擇會員（已選 ${count} / ${total} 位）`;
  _scalePlacard();
}

async function renderPlacard() {
  _loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
  _loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');

  el.innerHTML = `<div style="text-align:center;padding:48px 20px;color:var(--text-soft);">載入中...</div>`;

  const tab = _placardSubTab;
  if (tab === 'guest' && _guestData === null) await fetchGuests();
  if (tab === 'guest' && _guestData === null) { el.innerHTML = `<div style="text-align:center;padding:48px 20px;color:var(--red);">載入失敗，請重試 <button class="btn" style="margin-left:12px;background:var(--red);color:white;" onclick="_guestData=null;renderPlacard()">重試</button></div>`; return; }

  if (tab === 'member' && !_memberData) { el.innerHTML = `<div style="text-align:center;padding:48px 20px;color:var(--red);">載入失敗，請重試</div>`; return; }

  const allMembers   = tab === 'member' ? [..._memberData]           : [];
  const sel          = tab === 'member' ? _getSelectedMembers()      : [];
  const count        = tab === 'guest'  ? weekGuests.length          : sel.length;
  const totalMembers = allMembers.length;
  const title = tab === 'guest' ? '來賓桌牌' : '會員桌牌';

    ? `本周 ${count} 位 · ${count} 張 A4（每張 1 位，上下對摺為立牌）`

        <div>

        </div>

          <button class="btn" style="background:white;border:1.5px solid var(--gray-border);color:var(--text-soft);" onclick="${tab==='guest'?'_guestData':'_memberData'}=null;renderPlacard()">重整</button>

function _memberSelectorHtml(members) {
  const sel = _getSelectedMembers();

function _placardBodyHtml(tab, weekGuests, members) {

    if (!weekGuests.length) {

function _buildMemberPlacardSheets(members) {
  let html = '';

function _memberPlacardSheetHtml(memberA, memberB) {

function _scalePlacard() {
  const outer = document.getElementById('placardOuter');
  const inner = document.getElementById('placardInner');
  if (!outer || !inner) return;
  const availW = outer.clientWidth;
  const baseW  = 794;
  const scale  = Math.min(1, availW / baseW);
  inner.style.transform = `scale(${scale})`;
  inner.style.marginLeft = Math.max(0, (availW - baseW * scale) / 2) + 'px';
  outer.style.height = (inner.scrollHeight * scale) + 'px';
}
window.addEventListener('resize', () => { if (_activeTab === 'placard') _scalePlacard(); });

async function printPlacards() {
  showToast('PDF 產生中，請稍候...');
  try {
    await Promise.all([
      _loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'),
      _loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js')
    ]);
  } catch { showToast('載入失敗，請確認網路'); return; }

  const sheets = document.querySelectorAll('#placardInner .placard-sheet');
  if (!sheets.length) return;

  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:absolute;left:-9999px;top:0;background:white;';
  document.body.appendChild(wrap);

  try {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4', compress: true });
    for (let i = 0; i < sheets.length; i++) {
      wrap.innerHTML = '';
      const clone = sheets[i].cloneNode(true);
      clone.style.boxShadow = 'none';
      clone.style.marginTop = '0';
      wrap.appendChild(clone);
      const canvas = await html2canvas(clone, {
        scale: 2, useCORS: true, allowTaint: false, logging: false, backgroundColor: '#ffffff'
      });
      if (i > 0) doc.addPage();
      doc.addImage(canvas.toDataURL('image/jpeg', 0.9), 'JPEG', 0, 0, 210, 297);
    }
    const fname = _placardSubTab === 'member' ? '會員桌牌' : '來賓桌牌';
    doc.save(`BNI-${fname}-${_todayIso()}.pdf`);
    showToast('PDF 已下載');
  } catch {
    showToast('PDF 產生失敗，請重試');
  } finally {
    document.body.removeChild(wrap);
  }
}

let _financeRaw = null;
let _financeParsed = null;
let _financeTermTab = null;
let _financeMonthsOpen = {};
let _financeSelectedMonth = null;
let _financeNotesOpen = {}; // { rowIndex: true }
let _receivableFilter = 'unpaid'; // all | unpaid | paid

function _finNum(v) {
  if (typeof v === 'number') return Math.round(v);
  if (!v) return 0;
  const m = String(v).replace(/[,，\s]/g, '').match(/^-?\d+(\.\d+)?/);
  return m ? Math.round(Number(m[0])) : 0;
}

function _finExtraDesc(v) {
  if (!v || typeof v === 'number') return '';
  const s = String(v).trim();
  return s.replace(/^-?[\d,，.\s]+/, '').replace(/^[（(]/, '').replace(/[）)]$/, '').trim();
}

function _finFmt(n) {
  if (!n) return '0';
  return n.toLocaleString('en-US');
}

function _finYM(dateStr) {
  if (!dateStr) return '';
  const m = String(dateStr).match(/(\d{4})\/(\d{1,2})/);
  return m ? `${m[1]}-${String(m[2]).padStart(2,'0')}` : '';
}

function _finIsTermSheet(rows) {
  for (let i = 0; i < Math.min(5, rows.length); i++) {
    if (rows[i] && rows[i][0] === '日期' && rows[i][1] === '性質') return i;
  }
  return -1;
}

function _parseTermSheet(rows) {
  const headerIdx = _finIsTermSheet(rows);
  if (headerIdx < 0) return null;
  const hdr = rows[headerIdx] || [];
  const isLegacy = hdr.length >= 11;
  const C = isLegacy
    ? { date:0, type:1, income:2, expense:3, balance:4, paid:5, total:6, exIn:7, exOut:8, finalBal:9, note:10 }
    : { date:0, type:1, income:2, expense:3, balance:4, paid:5, total:6, exIn:-1, exOut:-1, finalBal:4, note:7 };

  const records = [];
  let initial = 0;
  let initialDate = '';
  let currentDate = '';
  const specialItems = [];
  let inSpecial = false;
  let specialName = '';

  for (let i = headerIdx + 1; i < rows.length; i++) {
    const row = rows[i] || [];
    let dateRaw = String(row[0] || '').trim();
    const type = String(row[1] || '').trim();
    if (!dateRaw && !type) continue;

    // 特殊活動標題列：以關鍵字偵測，無論是否填金額都視為活動起點
    const SPECIAL_KEYWORDS = /晚宴|餐會|聚餐|大會|慶祝|週年|表揚|募款|主辦|專題|論壇|工作坊|頒獎|尾牙|春酒|入會典禮|發表|大型/;
    if (type && SPECIAL_KEYWORDS.test(type) && !type.includes('入席費') && !type.includes('早餐')) {
      inSpecial = true;
      specialName = type;
      const inc = _finNum(row[C.income]);
      const exp = _finNum(row[C.expense]);
      if (inc > 0) {
        specialItems.push({ name: type, amount: inc, kind: 'income', date: dateRaw || currentDate });
      } else if (exp > 0) {
        specialItems.push({ name: type, amount: exp, kind: 'expense', date: dateRaw || currentDate });
      }
      if (dateRaw) currentDate = dateRaw;
      continue;
    }
    // 在 inSpecial 區段且日期欄空、性質非入席費/早餐 → 特殊活動子項
    if (inSpecial && !dateRaw && type && !type.includes('入席費') && !type.includes('早餐') && !type.includes('屆')) {
      const inAmt = _finNum(row[C.income]);
      const outAmt = _finNum(row[C.expense]);
      specialItems.push({
        name: type,
        amount: inAmt > 0 ? inAmt : outAmt,
        kind: inAmt > 0 ? 'income' : 'expense',
        note: String(row[C.note] || '').trim(),
        date: currentDate,
      });
      continue;
    }
    if (inSpecial && (type.includes('入席費') || type.includes('早餐') || type.includes('屆'))) {
      inSpecial = false;
    }

    // 屆期初始
    if (type.includes('初始') || /^第[一二三四五六七八九十]期初始$/.test(type)) {
      initial = _finNum(row[4]);
      initialDate = dateRaw;
      continue;
    }

    // 月份標題行（無收支只有標籤）：例如「第六屆04月」「2026/3/6 第五屆3月（餐費漲至700)」
    const monthHeader = (type && /第[一二三四五六七八九十]屆\s*\d+月/.test(type) && !type.includes('入席費') && !type.includes('早餐'));
    const dateMonthHeader = /第[一二三四五六七八九十]屆\s*\d+月/.test(dateRaw);
    if (monthHeader || dateMonthHeader) {
      // 跳過標題本身（不入紀錄）
      if (dateRaw) currentDate = dateRaw.replace(/\s*第.*$/, '').trim();
      continue;
    }

    if (dateRaw) currentDate = dateRaw;

    records.push({
      rowIndex: i + 1, // Apps Script 1-based row number
      date: currentDate,
      ym: _finYM(currentDate),
      type,
      income:  _finNum(row[C.income]),
      expense: _finNum(row[C.expense]),
      balance: _finNum(row[C.balance]),
      paid:    _finNum(row[C.paid]),
      total:   _finNum(row[C.total]),
      extraIncome:  C.exIn  >= 0 ? _finNum(row[C.exIn])  : 0,
      extraExpense: C.exOut >= 0 ? _finNum(row[C.exOut]) : 0,
      extraDesc:    C.exOut >= 0 ? (_finExtraDesc(row[C.exOut]) || _finExtraDesc(row[C.exIn])) : '',
      finalBalance: _finNum(row[C.finalBal]) || _finNum(row[C.balance]),
      note: String(row[C.note] || '').trim(),
    });
  }

  return { initial, initialDate, records, specialItems };
}

function _parseFinance(raw) {
  if (!raw || !raw.sheets) return null;
  const result = { terms: [], budget: null, receivables: [] };
  for (const [name, rows] of Object.entries(raw.sheets)) {
    if (!rows || !rows.length) continue;
    if (name === '應收追蹤') {
      result.receivables = _parseReceivables(rows);
      continue;
    }
    const parsed = _parseTermSheet(rows);
    if (parsed) {
      result.terms.push({ name, ...parsed });
    } else {
      result.budget = result.budget || { name, rows };
    }
  }
  return result;
}

function _parseReceivables(rows) {
  const list = [];
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i] || [];
    if (!r[1] && !r[2] && !_finNum(r[3])) continue;
    list.push({
      rowIndex: i + 1,
      date: String(r[0] || '').trim(),
      member: String(r[1] || '').trim(),
      item: String(r[2] || '').trim(),
      amount: _finNum(r[3]),
      status: String(r[4] || '').trim() || '未繳',
      settleDate: String(r[5] || '').trim(),
      settleSheet: String(r[6] || '').trim(),
      note: String(r[7] || '').trim(),
    });
  }
  return list;
}

async function _fetchFinance() {
  if (!FINANCE_API_URL) return null;
  try {
    const res = await fetch(FINANCE_API_URL, { signal: AbortSignal.timeout(20000) });
    const j = await res.json();
    if (!j || !j.ok) throw new Error(j && j.error || 'unknown');
    _financeRaw = j;
    _financeParsed = _parseFinance(j);
    try { localStorage.setItem('bni_finance_v1', JSON.stringify(j)); } catch {}
    return _financeParsed;
  } catch (e) {
    return null;
  }
}

function _loadFinanceFromCache() {
  try {
    const s = localStorage.getItem('bni_finance_v1');
    if (s) {
      _financeRaw = JSON.parse(s);
      _financeParsed = _parseFinance(_financeRaw);
    }
  } catch {}
}

function _termSummary(term) {
  let inc = 0, exp = 0, exInc = 0, exExp = 0;
  let totalPaid = 0, totalCnt = 0;
  const weekSet = new Set();
  const months = {};
  for (const r of term.records) {
    inc += r.income;
    exp += r.expense;
    exInc += r.extraIncome;
    exExp += r.extraExpense;
    if (r.paid > 0) totalPaid += r.paid;
    if (r.total > 0) totalCnt += r.total;
    if (r.date) {
      const d = new Date(r.date);
      if (!isNaN(d.getTime())) {
        const sunday = new Date(d);
        sunday.setDate(d.getDate() - d.getDay());
        weekSet.add(`${sunday.getFullYear()}-${String(sunday.getMonth()+1).padStart(2,'0')}-${String(sunday.getDate()).padStart(2,'0')}`);
      }
    }
    if (r.ym) {
      if (!months[r.ym]) months[r.ym] = { ym: r.ym, records: [], inc: 0, exp: 0, lastBal: 0 };
      months[r.ym].records.push(r);
      months[r.ym].inc += r.income;
      months[r.ym].exp += r.expense + r.extraExpense;
      if (r.finalBalance) months[r.ym].lastBal = r.finalBalance;
    }
  }
  const weeks = weekSet.size;
  const last = term.records[term.records.length - 1];
  return {
    totalIncome: inc + exInc,
    totalExpense: exp + exExp,
    currentBalance: last ? (last.finalBalance || last.balance) : term.initial,
    weeks,
    avgPaid: weeks ? Math.round(totalPaid / weeks) : 0,
    months: Object.values(months).sort((a, b) => a.ym.localeCompare(b.ym)),
  };
}

function _financeRenderKpi(term, sum) {
  const updated = _financeRaw && _financeRaw.updated
    ? _financeRaw.updated.replace('T',' ').slice(0,19)
    : '';
  return `
    <div class="fin-summary">
      <div class="fin-summary-cell hero">
        <div class="lbl">目前結餘</div>
        <div class="val">${_finFmt(sum.currentBalance)}</div>
      </div>
      <div class="fin-summary-cell">
        <div class="lbl">會議週次</div>
        <div class="val">${sum.weeks}</div>
      </div>
      <div class="fin-summary-cell">
        <div class="lbl">期初結餘</div>
        <div class="val">${_finFmt(term.initial)}</div>
      </div>
      <div class="fin-summary-cell updated">
        <div class="lbl">資料更新</div>
        <div class="val">${_escH(updated || '—')}</div>
      </div>
    </div>
  `;
}

function _financeRenderMonthWeeks(m) {
  const weekMap = {};
  for (const r of m.records) {
    if (!weekMap[r.date]) weekMap[r.date] = [];
    weekMap[r.date].push(r);
  }
  const weeksHtml = Object.entries(weekMap).map(([date, rs]) => {
    const items = [];
    for (const r of rs) {
      const hasIn = r.income > 0;
      const hasOut = r.expense > 0;
      const meta = (r.paid || r.total) ? `${r.paid}/${r.total} 人` : '';
      const noteOpen = !!_financeNotesOpen[r.rowIndex];
      items.push({
        type:'tx', main: true,
        kind: hasIn ? 'in' : (hasOut ? 'out' : ''),
        amt:  hasIn ? r.income : (hasOut ? r.expense : 0),
        desc: r.type, meta, rowIndex: r.rowIndex,
        hasNote: !!r.note, noteOpen
      });
      if (r.extraExpense > 0) {
        items.push({ type:'tx', sub:true, kind:'out', amt:r.extraExpense, desc: r.extraDesc || '額外支出', rowIndex:r.rowIndex });
      }
      if (r.extraIncome > 0) {
        items.push({ type:'tx', sub:true, kind:'in', amt:r.extraIncome, desc: r.extraDesc || '額外收入', rowIndex:r.rowIndex });
      }
      if (r.note && noteOpen) {
        items.push({ type:'note', content: r.note });
      }
    }
    const linesHtml = items.map(L => {
      if (L.type === 'note') {
        return `<div class="fin-week-note">${_escH(L.content)}</div>`;
      }
      const tag = L.kind === 'in' ? '收入' : (L.kind === 'out' ? '支出' : '—');
      const sign = L.kind === 'in' ? '+' : (L.kind === 'out' ? '-' : '');
      const amtStr = L.amt > 0 ? `${sign}${_finFmt(L.amt)}` : '—';
      const tagHtml = L.kind ? `<span class="tag ${L.kind}">${tag}</span>` : `<span></span>`;
      const noteToggle = (L.main && L.hasNote)
        ? `<span class="note-toggle ${L.kind || ''} ${L.noteOpen?'open':''}" onclick="event.stopPropagation();toggleFinanceNote(${L.rowIndex})" title="${L.noteOpen?'收合':'展開'}備註">▶</span>`
        : `<span class="note-toggle-placeholder"></span>`;
      const isClickable = (_canEditTab('finance') && L.main);
      const cls = `fin-line${L.sub?' sub':''}${isClickable?' clickable':''}`;
      const onClick = isClickable ? ` onclick="openFinanceEdit(${L.rowIndex})"` : '';
      return `
        <div class="${cls}"${onClick}>
          ${tagHtml}
          ${noteToggle}
          <span class="amt ${L.kind || ''}">${amtStr}</span>
          <span class="desc">${_escH(L.desc)}${L.meta?`<span class="meta">${L.meta}</span>`:''}</span>
        </div>
      `;
    }).join('');

    const lastRec = rs[rs.length - 1];
    const finalBal = lastRec ? lastRec.finalBalance : 0;

    return `
      <div class="fin-week">
        <div class="fin-week-head">
          <span class="fin-week-date">${_escH(date)}</span>
          <span class="fin-week-balance">
            結餘 ${_finFmt(finalBal)}
          </span>
        </div>
        ${linesHtml}
      </div>
    `;
  }).join('');

  return weeksHtml;
}

function selectFinanceMonth(ym) {
  _financeSelectedMonth = ym;
  renderFinance();
}

function toggleFinanceNote(rowIndex) {
  _financeNotesOpen[rowIndex] = !_financeNotesOpen[rowIndex];

function _financeRenderSpecial(term) {
  if (!term.specialItems || !term.specialItems.length) return '';
  let inSum = 0, outSum = 0;
  const rows = term.specialItems.map(it => {
    if (it.kind === 'income') inSum += it.amount;
    else outSum += it.amount;
    return `
      <div class="fin-special-row">
        <span class="lbl">${_escH(it.name)}${it.note ? ' <span style="font-size:11px;color:var(--text-soft);">（' + _escH(it.note) + '）</span>' : ''}</span>
        <span class="amt ${it.kind === 'income' ? 'in' : 'out'}">${it.kind === 'income' ? '+' : '-'}${_finFmt(it.amount)}</span>
      </div>
    `;
  }).join('');
  return `
    <div class="fin-section-title">特殊活動</div>
    <div class="fin-special-card">
      ${rows}
      <div class="fin-special-row" style="margin-top:8px;border-top:2px solid var(--gray-border);padding-top:10px;">
        <span class="lbl" style="font-weight:900;">小計</span>
        <span class="amt in">+${_finFmt(inSum)}</span>
        <span class="amt out" style="margin-left:14px;">-${_finFmt(outSum)}</span>
        <span class="amt" style="margin-left:14px;color:var(--text);">淨額 ${_finFmt(inSum - outSum)}</span>
      </div>
    </div>
  `;
}

function _financeRenderBudget(budget) {
  if (!budget) return '';
  const tables = [];
  let cur = null;
  for (const row of budget.rows) {
    const a = String(row[1] || '').trim();
    const b = String(row[2] || '').trim();
    const c = String(row[3] || '').trim();
    const d = String(row[4] || '').trim();
    const e = String(row[5] || '').trim();
    if (/項目|金額/.test(a) || /項目|金額/.test(d)) {
      // header → 開新表
      if (a) { cur = { title: a, items: [] }; tables.push(cur); }
      if (d && d !== a) { tables.push({ title: d, items: [] }); }
      continue;
    }
    if (cur && a) cur.items.push({ name: a, amount: b });
    if (d) {
      const last = tables[tables.length - 1];
      if (last && last.title.indexOf(d) < 0 && last !== cur) last.items.push({ name: d, amount: e });
      else if (cur && last === cur && tables.length >= 2) {
        const second = tables[tables.length - 2];
        if (second && second !== cur) second.items.push({ name: d, amount: e });
      }
    }
  }
  // 簡化：直接平鋪所有非空白的(name, amount)對
  const flat = [];
  let group = null;
  for (const row of budget.rows) {
    for (let col = 0; col < row.length; col++) {
      const cell = String(row[col] || '').trim();
      if (/每月變動收入|每月固定收入|每月變動支出|每月固定支出|會期金額/.test(cell)) {
        group = { title: cell, items: [] };
        flat.push(group);
      }
    }
    if (!group) continue;
    // 嘗試抓 name + amount 對：第2,3 欄 / 第5,6 欄
    const pairs = [[1, 2], [4, 5]];
    for (const [ni, ai] of pairs) {
      const nm = String(row[ni] || '').trim();
      const am = row[ai];
      if (nm && nm !== group.title && !/項目|金額/.test(nm) && (am !== '' && am !== null && am !== undefined)) {
        flat.push({ inline: true, name: nm, amount: am });
      }
    }
  }
  // 整理：依 title 分組
  const groups = [];
  let g = null;
  for (const row of budget.rows) {
    let openedTitleThisRow = false;
    for (let col = 0; col < row.length; col++) {
      const cell = String(row[col] || '').trim();
      if (/每月變動收入|每月固定收入|每月變動支出|每月固定支出|會期金額/.test(cell)) {
        g = { title: cell, items: [] };
        groups.push(g);
        openedTitleThisRow = true;
      }
    }
    if (!g || openedTitleThisRow) continue;
    const pairs = [[1, 2], [4, 5]];
    for (const [ni, ai] of pairs) {
      const nm = String(row[ni] || '').trim();
      const am = row[ai];
      if (nm && !/項目|金額/.test(nm) && (am !== '' && am !== null && am !== undefined)) {
        g.items.push({ name: nm, amount: am });
      }
    }
  }
  const cards = groups.filter(x => x.items.length).map(grp => {
    const rowsHtml = grp.items.map(it => `
      <div class="row"><span class="lbl">${_escH(it.name)}</span><span class="amt">${_escH(String(it.amount))}</span></div>
    `).join('');
    return `<div class="fin-budget-card"><h4>${_escH(grp.title)}</h4>${rowsHtml}</div>`;
  }).join('');
  return `
    <div class="fin-section-title">預算參考</div>
    <div class="fin-budget-grid">${cards || '<div class="fin-empty">無預算資料</div>'}</div>
  `;
}

function toggleFinanceMonth(ym) {
  _financeMonthsOpen[ym] = !_financeMonthsOpen[ym];
  renderFinance();
}

function switchFinanceTerm(name) {
  _financeTermTab = name;
  _financeMonthsOpen = {};
  renderFinance();
}

function renderFinance() {
  const el = document.getElementById('financeContent');

  if (!FINANCE_API_URL) {
    el.innerHTML = `
      <div class="card" style="padding:32px 20px;line-height:1.8;">
        <div style="font-size:18px;font-weight:900;color:var(--red);margin-bottom:10px;">財務控管 - 等待後端部署</div>
        <div style="font-size:13px;color:var(--text-soft);">
          請先依 <code>apps-script-finance.gs</code> 中的說明部署 Google Apps Script，<br>
          並把產生的「網頁應用程式網址」交回，將其填入 <code>index.html</code> 中的 <code>FINANCE_API_URL</code>。
        </div>
      </div>
    `;
    return;
  }

  if (!_financeParsed) _loadFinanceFromCache();

  if (!_financeParsed) {
    el.innerHTML = `<div class="fin-empty">載入財務資料中...</div>`;
    _fetchFinance().then(p => { if (p) renderFinance(); else {
      el.innerHTML = `<div class="card" style="padding:24px;color:var(--red);">財務資料載入失敗，請稍後重試或檢查 Apps Script 部署。</div>`;
    }});
    return;
  }

  // 背景刷新
  _fetchFinance().then(p => { if (p && document.getElementById('financeContent').isConnected && _activeTab === 'finance') {
    // 僅在資料變動時重繪，避免折疊狀態被打斷
    const old = JSON.stringify(_financeParsed);
    _financeParsed = p;
    if (JSON.stringify(p) !== old) renderFinance();
  }});

  const terms = _financeParsed.terms;
  if (!terms.length) {
    el.innerHTML = `<div class="fin-empty">尚無會期資料</div>`;
    return;
  }

  // 預設顯示第一個（最新）屆
  if (!_financeTermTab || !terms.find(t => t.name === _financeTermTab)) {
    _financeTermTab = terms[0].name;
  }
  const term = terms.find(t => t.name === _financeTermTab);
  const sum = _termSummary(term);

  // 月份預設選最新一個（'__overview__' 是合法值，不要被覆蓋）
  if (_financeSelectedMonth !== '__overview__' && !sum.months.find(m => m.ym === _financeSelectedMonth)) {
    _financeSelectedMonth = sum.months.length ? sum.months[sum.months.length - 1].ym : null;
  }

  const toolbar = `
    <div class="fin-toolbar">
      <select class="fin-term-select" onchange="switchFinanceTerm(this.value)">
        ${terms.map(t => `<option value="${_escH(t.name)}" ${t.name===_financeTermTab?'selected':''}>${_escH(t.name)}</option>`).join('')}
      </select>
      <button class="fin-tb-btn" onclick="refreshFinance()" title="重新整理">↻</button>
    </div>
  `;

  el.innerHTML = `
    ${toolbar}
    ${_financeRenderKpi(term, sum)}
    ${_financeRenderReceivables()}
    <div class="fin-section-title-row">
      <div class="fin-section-title">月份明細</div>
      <div style="display:flex;gap:8px;align-items:center;">
        ${_financeRenderMonthPicker(sum)}
        ${_canEditTab('finance') ? `<button class="btn btn-primary" style="padding:7px 14px;font-size:12px;white-space:nowrap;" onclick="openFinanceAdd()">新增</button>` : ''}
      </div>
    </div>
    ${_renderMonthsBlock(term, sum)}
    ${_financeRenderSpecial(term)}
  `;
}

function _financeRenderMonthPicker(sum) {
  if (!sum.months.length) return '';
  const isOverview = _financeSelectedMonth === '__overview__';
  const pickerOptions = [
    `<option value="__overview__" ${isOverview?'selected':''}>本屆概況</option>`,
    ...sum.months.map(m => {
      const [yy, mm] = m.ym.split('-');
      return `<option value="${m.ym}" ${m.ym===_financeSelectedMonth?'selected':''}>${yy} 年 ${parseInt(mm)} 月</option>`;
    })
  ].join('');
  return `<select class="fin-month-picker" onchange="selectFinanceMonth(this.value)">${pickerOptions}</select>`;
}

function _renderMonthsBlock(term, sum) {
  if (!sum.months.length) return '<div class="fin-empty">本屆尚無紀錄</div>';

  const isOverview = _financeSelectedMonth === '__overview__';
  const selected = isOverview ? null : sum.months.find(m => m.ym === _financeSelectedMonth);

  const contentHtml = isOverview
    ? _financeRenderTermOverview(sum)
    : (selected ? `<div class="fin-month-weeks">${_financeRenderMonthWeeks(selected)}</div>` : '<div class="fin-empty">未選擇月份</div>');

  return `
    <div class="fin-months-block">
      ${contentHtml}
    </div>
  `;
}

function _financeRenderTermOverview(sum) {
  let totIn = 0, totOut = 0;
  const rows = sum.months.map(m => {
    totIn  += m.inc;
    totOut += m.exp;
    const [yy, mm] = m.ym.split('-');
    return `<tr onclick="selectFinanceMonth('${m.ym}')">
      <td>${yy} 年 ${parseInt(mm)} 月</td>
      <td class="in">+${_finFmt(m.inc)}</td>
      <td class="out">-${_finFmt(m.exp)}</td>
      <td class="bal">${_finFmt(m.lastBal)}</td>
    </tr>`;
  }).join('');
  return `
    <table class="fin-monthly-table">
      <thead><tr>
        <th>月份</th><th>收入</th><th>支出</th><th>月底結餘</th>
      </tr></thead>
      <tbody>
        ${rows}
        <tr class="total-row">
          <td>合計</td>
          <td class="in">+${_finFmt(totIn)}</td>
          <td class="out">-${_finFmt(totOut)}</td>
          <td class="bal">${_finFmt(sum.currentBalance)}</td>
        </tr>
      </tbody>
    </table>
  `;
}

// （保留舊函式以防其他地方引用，但已不被 renderFinance 呼叫）
function _renderMonthlySummary(term, sum) {
  if (!sum.months.length) return '<div class="fin-empty">無資料</div>';
  const budgetMonthly = _calcBudgetMonthlyExpense();
  let totIn = 0, totOut = 0;
  const rows = sum.months.map(m => {
    totIn += m.inc;
    totOut += m.exp;
    const diff = m.exp - budgetMonthly;
    const diffCls = diff > 0 ? 'out' : 'in';
    const diffSign = diff > 0 ? '超支' : '節省';
    const [yy, mm] = m.ym.split('-');
    return `<tr>
      <td>${parseInt(mm)} 月</td>
      <td class="in">+${_finFmt(m.inc)}</td>
      <td class="out">-${_finFmt(m.exp)}</td>
      <td class="bal">${_finFmt(m.lastBal)}</td>
      <td class="${diffCls}" title="預期月支出 ${_finFmt(budgetMonthly)}">${budgetMonthly ? `${diffSign} ${_finFmt(Math.abs(diff))}` : '—'}</td>
    </tr>`;
  }).join('');
  return `
    <table class="fin-monthly-table">
      <thead><tr>
        <th>月份</th><th>收入</th><th>支出</th><th>月底結餘</th><th>預算對照</th>
      </tr></thead>
      <tbody>
        ${rows}
        <tr>
          <td>合計</td>
          <td class="in">+${_finFmt(totIn)}</td>
          <td class="out">-${_finFmt(totOut)}</td>
          <td class="bal">${_finFmt(sum.currentBalance)}</td>
          <td>—</td>
        </tr>
      </tbody>
    </table>
  `;
}

function _calcBudgetMonthlyExpense() {
  // 從預算參考表計算「每月預期支出」（固定 + 變動）
  if (!_financeParsed || !_financeParsed.budget) return 0;
  let total = 0;
  for (const row of _financeParsed.budget.rows) {
    for (let col = 0; col < row.length; col++) {
      const cell = String(row[col] || '').trim();
      // 只挑「金額」欄位的數字
      const numMatch = cell.match(/^-(\d+)$/);
      if (numMatch) total += parseInt(numMatch[1]);
    }
  }
  return total;
}

function _financeRenderReceivables() {
  const list = (_financeParsed && _financeParsed.receivables) || [];
  const unpaid = list.filter(r => r.status === '未繳');
  const paid   = list.filter(r => r.status === '已繳');
  const totalUnpaid = unpaid.reduce((s, r) => s + r.amount, 0);

  const visible =
    _receivableFilter === 'all'  ? list :
    _receivableFilter === 'paid' ? paid :
                                   unpaid;

  const filterBar = `
    <div class="fin-recv-bar">
      <span class="fin-recv-title">應收追蹤</span>
      ${unpaid.length ? `<span class="fin-recv-total">未繳合計 ${_finFmt(totalUnpaid)}</span>` : ''}
      <span style="flex:1;"></span>
      <select class="fin-recv-filter-select" onchange="setReceivableFilter(this.value)">
        <option value="unpaid" ${_receivableFilter==='unpaid'?'selected':''}>未繳 ${unpaid.length}</option>
        <option value="paid"   ${_receivableFilter==='paid'?'selected':''}>已繳 ${paid.length}</option>
        <option value="all"    ${_receivableFilter==='all'?'selected':''}>全部 ${list.length}</option>
      </select>
      ${_canEditTab('finance') ? `<button class="btn btn-primary" style="padding:7px 14px;font-size:12px;" onclick="openReceivableAdd()">新增</button>` : ''}
    </div>
  `;

  let listHtml;
  if (!visible.length) {
    const emptyMsg = _receivableFilter === 'unpaid' ? '目前沒有未繳項目' :
                     _receivableFilter === 'paid'   ? '尚無已銷帳紀錄' :
                                                      '尚無應收紀錄';
    listHtml = `<div class="fin-recv-empty">${emptyMsg}</div>`;
  } else {
    listHtml = visible.map(r => {
      const isPaid = r.status === '已繳';
      const settleTxt = isPaid && r.settleDate
        ? `已銷 ${_escH(r.settleDate)}${r.settleSheet?'·'+_escH(r.settleSheet):''}` : '';
      const adminBtns = _canEditTab('finance')
        ? (isPaid
          ? `<button class="btn-act del" onclick="confirmReceivableDelete(${r.rowIndex})">×</button>`
          : `<button class="btn-act settle" onclick="confirmReceivableSettle(${r.rowIndex})">銷帳</button><button class="btn-act del" onclick="confirmReceivableDelete(${r.rowIndex})">×</button>`)
        : '';
      const subInfo = [_escH(r.date), _escH(r.item), r.note ? _escH(r.note) : '', settleTxt].filter(Boolean).join(' · ');
      return `
        <div class="fin-recv-row${isPaid?' paid':''}">
          <span class="badge ${isPaid?'paid':'unpaid'}">${isPaid?'已繳':'未繳'}</span>
          <div class="info">
            <div class="member">${_escH(r.member)}</div>
            <div class="item">${subInfo}</div>
          </div>
          <span class="amt">${_finFmt(r.amount)}</span>
          <div class="actions">${adminBtns}</div>
        </div>
      `;
    }).join('');
  }

  return `${filterBar}<div class="fin-recv-card">${listHtml}</div>`;
}

function setReceivableFilter(f) {
  _receivableFilter = f;
  renderFinance();
}

let _chartJsLoaded = null;
function _ensureChartJs() {
  if (_chartJsLoaded) return _chartJsLoaded;
  _chartJsLoaded = new Promise((resolve, reject) => {
    if (window.Chart) return resolve();
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js';
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('chart.js load failed'));
    document.head.appendChild(s);
  });
  return _chartJsLoaded;
}

let _financeTrendChart = null;
function _drawFinanceTrend(term) {
  const canvas = document.getElementById('finTrendChart');
  if (!canvas || !window.Chart) return;
  if (_financeTrendChart) { _financeTrendChart.destroy(); _financeTrendChart = null; }

  const points = [];
  if (term.initial) points.push({ x: term.initialDate || term.records[0]?.date || '', y: term.initial });
  for (const r of term.records) {
    if (r.finalBalance) points.push({ x: r.date, y: r.finalBalance });
  }
  if (!points.length) return;

  _financeTrendChart = new Chart(canvas.getContext('2d'), {
    type: 'line',
    data: {
      labels: points.map(p => p.x),
      datasets: [{
        label: '結餘',
        data: points.map(p => p.y),
        borderColor: '#c0392b',
        backgroundColor: 'rgba(192,57,43,0.08)',
        fill: true,
        tension: 0.25,
        pointRadius: 2,
        pointHoverRadius: 5,
        borderWidth: 2,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => `結餘 ${ctx.parsed.y.toLocaleString()}`,
          }
        }
      },
      scales: {
        x: { ticks: { font: { size: 10 }, maxRotation: 45, minRotation: 45 } },
        y: {
          ticks: {
            font: { size: 10 },
            callback: v => v.toLocaleString()
          }
        }
      }
    }
  });
}

// 從「億展第X屆」解析屆別號（一-十）
function _termNumOfName(name) {
  const m = String(name||'').match(/^億展第([一二三四五六七八九十]+)屆$/);
  if (!m) return 0;
  const map = {一:1,二:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9,十:10};
  const s = m[1];
  if (s in map) return map[s];
  if (s[0]==='十') return 10 + (map[s[1]]||0);
  if (s.length===2 && s[1]==='十') return map[s[0]]*10;
  if (s.length===3 && s[1]==='十') return map[s[0]]*10 + (map[s[2]]||0);
  return 0;
}
function _isV6PlusIncome() {
  return _termNumOfName(_financeTermTab) >= 6;
}

function _setFinAddKind(kind) {

  if (list) {
    list.innerHTML = (FINANCE_TYPE_SUGGESTIONS[kind] || []).map(t => `<option value="${_escH(t)}">`).join('');

  // 第六屆+ 收入或支出：切換為下拉專用區塊

  const normal = document.getElementById('finAddNormal');

  if (normal) normal.style.display = useV6 ? 'none' : '';
  if (useV6) {
    // 設定下拉選項與 label
    const sel = document.getElementById('finAddV6Type');

      lbl.textContent = '收入類型';

    }
    _setFinAddV6Type(sel.value);
  }
}

async function submitFinanceAdd() {
  const sheet  = _financeTermTab;
  const kind   = document.getElementById('finAddKind').value;
  const useV6  = _isV6PlusIncome(); // 第六屆+ 收支都用 V6

  if (!sheet) { showToast('請先選擇屆別'); return; }

  // 收集要新增的紀錄陣列：[{ date, type, kind, amount, paid, total, note }, ...]
  const records = [];

  if (useV6) {
    const date = document.getElementById('finAddDateV6').value.trim().replace(/-/g, '/');
    if (!date) { showToast('請填日期'); return; }
    const v6Type = document.getElementById('finAddV6Type').value;

    if (kind === 'income' && v6Type === '場餐費') {
      const memN = +document.getElementById('finAddV6MemPaid').value || 0;
      const memP = +document.getElementById('finAddV6MemPrice').value || 0;
      const gstN = +document.getElementById('finAddV6GstPaid').value || 0;
      const gstP = +document.getElementById('finAddV6GstPrice').value || 0;
      const memTotal = memN * memP;
      const gstTotal = gstN * gstP;
      if (memTotal) records.push({ date, type: '場餐費（會員）', kind: 'income', amount: memTotal, paid: memN, total: memN, note: '' });
      if (gstTotal) records.push({ date, type: '場餐費（來賓）', kind: 'income', amount: gstTotal, paid: gstN, total: gstN, note: '' });
      if (!records.length) { showToast('會員或來賓兩組至少填一組（人數×單價）'); return; }
    } else if (kind === 'income' && v6Type === '其他') {
      const src = document.getElementById('finAddV6OtherSrc').value.trim();
      const amt = +document.getElementById('finAddV6OtherAmt').value || 0;
      if (!src) { showToast('請填收入來源'); return; }
      if (!amt) { showToast('請填費用'); return; }
      records.push({ date, type: src, kind: 'income', amount: amt, paid: 0, total: 0, note: '' });
    } else if (kind === 'expense' && v6Type === '飯店費用') {
      const m = +document.getElementById('finAddV6HotelMem').value || 0;
      const g = +document.getElementById('finAddV6HotelGst').value || 0;
      const c = +document.getElementById('finAddV6HotelCons').value || 0;
      const p = +document.getElementById('finAddV6HotelPrice').value || 0;
      const sum = m + g + c;
      const total = sum * p;
      if (!sum)   { showToast('請填會員/來賓/董顧人數'); return; }
      if (!total) { showToast('請填單價'); return; }
      records.push({
        date, type: '飯店費用', kind: 'expense', amount: total, paid: sum, total: sum,
        note: `會員${m}/來賓${g}/董顧${c} × ${p}`
      });
    } else if (kind === 'expense' && v6Type === '其他') {
      const desc = document.getElementById('finAddV6ExpOtherDesc').value.trim();
      const p    = +document.getElementById('finAddV6ExpOtherPrice').value || 0;
      const q    = +document.getElementById('finAddV6ExpOtherQty').value || 0;
      const total = p * q;
      if (!desc)  { showToast('請填內容'); return; }
      if (!p)     { showToast('請填單價'); return; }
      if (!q)     { showToast('請填數量'); return; }
      records.push({ date, type: desc, kind: 'expense', amount: total, paid: q, total: q, note: q > 1 ? `${p} × ${q}` : '' });
    }
  } else {
    const date   = document.getElementById('finAddDate').value.trim().replace(/-/g, '/');
    const type   = document.getElementById('finAddType').value.trim();
    const amount = +document.getElementById('finAddAmount').value || 0;
    const paid   = +document.getElementById('finAddPaid').value || 0;
    const total  = +document.getElementById('finAddTotal').value || 0;
    const note   = document.getElementById('finAddNote').value.trim();
    if (!date)   { showToast('請填日期'); return; }
    if (!type)   { showToast('請填性質'); return; }
    if (!amount) { showToast('請填金額'); return; }
    records.push({ date, type, kind, amount, paid, total, note });
  }

  // ===== 樂觀更新：本地依序 push 每筆紀錄，並重新計算結餘 =====
  const sheetData = _financeRaw?.sheets?.[sheet];
  const optimisticIndices = [];
  if (sheetData?.length) {
    const ncol = sheetData[0]?.length || 8;
    let lastBal = 0;
    for (let i = sheetData.length - 1; i >= 0; i--) {
      const v = Number(sheetData[i][4]);
      if (!isNaN(v) && sheetData[i][4] !== '' && sheetData[i][4] !== null) { lastBal = v; break; }
    }
    for (const r of records) {
      lastBal = r.kind === 'income' ? lastBal + r.amount : lastBal - r.amount;
      const row = new Array(ncol).fill('');
      row[0] = r.date;
      row[1] = r.type;
      row[2] = r.kind === 'income'  ? r.amount : '';
      row[3] = r.kind === 'expense' ? r.amount : '';
      row[4] = lastBal;
      row[5] = r.paid  || '';
      row[6] = r.total || '';
      row[ncol - 1] = r.note;
      if (ncol === 11) row[9] = lastBal;
      sheetData.push(row);
      optimisticIndices.push(sheetData.length - 1);
    }
    _financeParsed = _parseFinance(_financeRaw);
  }
  closeFinanceAdd();
  if (optimisticIndices.length) renderFinance();
  showToast(`已新增 ${records.length} 筆`);

  // ===== 真正 POST 在背景同步（依序送，避免後端結餘亂序） =====
  try {
    for (const r of records) {
      const res = await fetch(FINANCE_API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'append', sheet, ...r })
      });
      const j = await res.json();
      if (!j.ok) throw new Error(j.error || 'unknown');
      if (j.routed && j.sheet) _financeTermTab = j.sheet;
    }
    _fetchFinance().then(() => { if (_activeTab === 'finance') renderFinance(); });
  } catch (err) {
    // 回滾本地樂觀更新（從尾端移除剛 push 的列）
    if (sheetData && optimisticIndices.length) {
      // 由大到小 splice
      optimisticIndices.sort((a,b) => b - a).forEach(idx => sheetData.splice(idx, 1));
      _financeParsed = _parseFinance(_financeRaw);
      renderFinance();
    }
    showToast('儲存失敗：' + (err.message || err));
  }
}

// ===== 編輯 =====
function _findFinanceRecord(rowIndex) {
  if (!_financeParsed) return null;
  for (const t of _financeParsed.terms) {
    if (t.name !== _financeTermTab) continue;
    const r = t.records.find(rec => rec.rowIndex === rowIndex);
    if (r) return { term: t, record: r };
  }
  return null;
}

function _detectV6EditMode(r) {
  if (r.income > 0) {
    if (r.type === '場餐費（會員）') return 'mealMember';
    if (r.type === '場餐費（來賓）') return 'mealGuest';
    return 'incomeOther';
  }
  if (r.expense > 0) {
    if (r.type === '飯店費用') return 'hotel';
    return 'expenseOther';
  }
  return 'incomeOther';
}

async function _submitFinanceEditApply(rowIndex) {
  const sheet  = _financeTermTab;
  const date   = document.getElementById('finAddDateV6').value.trim().replace(/-/g, '/');
  const kind   = document.getElementById('finAddKind').value;
  const v6Type = document.getElementById('finAddV6Type').value;
  if (!date) { showToast('請填日期'); return; }

  let updateValues = null;
  const appendRecords = [];

  if (kind === 'income' && v6Type === '場餐費') {
    const memN = +document.getElementById('finAddV6MemPaid').value || 0;
    const memP = +document.getElementById('finAddV6MemPrice').value || 0;
    const gstN = +document.getElementById('finAddV6GstPaid').value || 0;
    const gstP = +document.getElementById('finAddV6GstPrice').value || 0;
    const memT = memN * memP;
    const gstT = gstN * gstP;
    if (!memT && !gstT) { showToast('會員或來賓至少填一組'); return; }
    if (memT && gstT) {
      updateValues = { date, type: '場餐費（會員）', income: memT, expense: 0, paid: memN, total: memN, note: '' };
      appendRecords.push({ date, type: '場餐費（來賓）', kind: 'income', amount: gstT, paid: gstN, total: gstN, note: '' });
    } else if (memT) {
      updateValues = { date, type: '場餐費（會員）', income: memT, expense: 0, paid: memN, total: memN, note: '' };
    } else {
      updateValues = { date, type: '場餐費（來賓）', income: gstT, expense: 0, paid: gstN, total: gstN, note: '' };
    }
  } else if (kind === 'income' && v6Type === '其他') {
    const src = document.getElementById('finAddV6OtherSrc').value.trim();
    const amt = +document.getElementById('finAddV6OtherAmt').value || 0;
    if (!src) { showToast('請填收入來源'); return; }
    if (!amt) { showToast('請填費用'); return; }
    updateValues = { date, type: src, income: amt, expense: 0, paid: 0, total: 0, note: '' };
  } else if (kind === 'expense' && v6Type === '飯店費用') {
    const m = +document.getElementById('finAddV6HotelMem').value || 0;
    const g = +document.getElementById('finAddV6HotelGst').value || 0;
    const c = +document.getElementById('finAddV6HotelCons').value || 0;
    const p = +document.getElementById('finAddV6HotelPrice').value || 0;
    const sum = m + g + c;
    const total = sum * p;
    if (!sum)   { showToast('請填會員/來賓/董顧人數'); return; }
    if (!total) { showToast('請填單價'); return; }
    updateValues = { date, type: '飯店費用', income: 0, expense: total, paid: sum, total: sum, note: `會員${m}/來賓${g}/董顧${c} × ${p}` };
  } else if (kind === 'expense' && v6Type === '其他') {
    const desc = document.getElementById('finAddV6ExpOtherDesc').value.trim();
    const p    = +document.getElementById('finAddV6ExpOtherPrice').value || 0;
    const q    = +document.getElementById('finAddV6ExpOtherQty').value || 0;
    const total = p * q;
    if (!desc)  { showToast('請填內容'); return; }
    if (!total) { showToast('請填單價與數量'); return; }
    updateValues = { date, type: desc, income: 0, expense: total, paid: q, total: q, note: q > 1 ? `${p} × ${q}` : '' };
  }

  if (!updateValues) { showToast('資料不完整'); return; }

  const btn = document.getElementById('finEditSave');
  btn.disabled = true; btn.textContent = '儲存中...';
  try {
    const r1 = await fetch(FINANCE_API_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'update', sheet, rowIndex, values: updateValues })
    });
    const j1 = await r1.json();
    if (!j1.ok) throw new Error(j1.error || 'unknown');
    for (const rec of appendRecords) {
      const r2 = await fetch(FINANCE_API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'append', sheet, ...rec })
      });
      const j2 = await r2.json();
      if (!j2.ok) throw new Error(j2.error || 'unknown');
    }
    showToast('已更新');
    closeFinanceEdit();
    await _fetchFinance();
    renderFinance();
  } catch (err) {
    showToast('更新失敗：' + (err.message || err));
    btn.disabled = false; btn.textContent = '儲存';
  }
}
function closeFinanceEdit() {
  const m = document.getElementById('financeEditModal');
  if (m) m.remove();
}

async function submitFinanceEdit(rowIndex) {
  const sheet = _financeTermTab;
  const v = {
    date:        document.getElementById('finEditDate').value.trim().replace(/-/g, '/'),
    type:        document.getElementById('finEditType').value.trim(),
    income:      +document.getElementById('finEditIncome').value || 0,
    expense:     +document.getElementById('finEditExpense').value || 0,
    paid:        +document.getElementById('finEditPaid').value || 0,
    total:       +document.getElementById('finEditTotal').value || 0,
    note:        document.getElementById('finEditNote').value.trim(),
  };

  const btn = document.getElementById('finEditSave');
  btn.disabled = true; btn.textContent = '儲存中...';
  try {
    const res = await fetch(FINANCE_API_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'update', sheet, rowIndex, values: v })
    });
    const j = await res.json();
    if (!j.ok) throw new Error(j.error || 'unknown');
    showToast('已更新（後續結餘已重算）');
    closeFinanceEdit();

    renderFinance();

    showToast('更新失敗：' + (err.message || err));
    btn.disabled = false; btn.textContent = '儲存';
  }
}

function confirmFinanceDelete(rowIndex) {
  if (!_canEditTab('finance')) { showToast('無權限'); return; }
  const found = _findFinanceRecord(rowIndex);
  if (!found) { showToast('找不到該紀錄'); return; }

async function submitReceivableAdd() {
  const dateRaw = document.getElementById('recvAddDate').value.trim();
  const date    = dateRaw.replace(/-/g, '/'); // type=date 給 YYYY-MM-DD，後端用 YYYY/MM/DD
  const member = document.getElementById('recvAddMember').value.trim();
  const item   = document.getElementById('recvAddItem').value.trim() || '入席費';
  const amount = +document.getElementById('recvAddAmount').value || 0;
  const note   = document.getElementById('recvAddNote').value.trim();

  if (!member) { showToast('請填會員姓名'); return; }
  if (!amount) { showToast('請填金額'); return; }

  // 樂觀更新：本地立即新增應收
  let optimisticPushed = false;
  if (_financeRaw?.sheets?.['應收追蹤']) {
    const ar = _financeRaw.sheets['應收追蹤'];
    ar.push([date, member, item, amount, '未繳', '', '', note]);
    _financeParsed = _parseFinance(_financeRaw);
    optimisticPushed = true;
  }
  closeReceivableAdd();
  if (optimisticPushed) renderFinance();
  showToast(optimisticPushed ? '已新增應收' : '儲存中…');

  try {
    const res = await fetch(FINANCE_API_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'addReceivable', date, member, item, amount, note })
    });
    const j = await res.json();
    if (!j.ok) throw new Error(j.error || 'unknown');
    _fetchFinance().then(() => { if (_activeTab === 'finance') renderFinance(); });
  } catch (err) {
    if (optimisticPushed && _financeRaw?.sheets?.['應收追蹤']) {
      _financeRaw.sheets['應收追蹤'].pop();
      _financeParsed = _parseFinance(_financeRaw);
      renderFinance();
    }
    showToast('儲存失敗：' + (err.message || err));
  }
}
