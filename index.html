<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>BNI-秘書財務小組</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="styles/base.css?v=20260507p">
</head>
<body>

<!-- LOADER -->
<div class="loader-overlay" id="loader">
  <div class="loader-spinner"></div>
  <div class="loader-text" id="loaderText">載入中...</div>
</div>

<!-- LOGIN（分會密碼 + 姓名 同頁）-->
<div class="login-page" id="loginPage" style="display:none">
  <div class="login-box">
    <h1>秘書財務小組</h1>
    <p id="loginPrompt">請輸入您的名稱登入</p>
    <input type="password" id="gateInput" placeholder="分會共用密碼" autocomplete="off" style="display:none">
    <input type="text" id="nameInput" placeholder="輸入姓名" autocomplete="off">
    <button class="btn-login" onclick="doLogin()">登 入</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- APP -->
<div class="app" id="appPage">
  <div class="header">
    <div class="header-left">
      <button class="menu-btn" id="menuBtn" type="button" onclick="toggleMenu(event)" style="display:none">
        <span class="menu-icon">&#9776;</span>
        <span class="menu-label" id="menuLabel">工事清單</span>
        <span class="menu-arrow">&#9662;</span>
      </button>
      <h2 id="headerTitle" style="display:none">秘書財務小組</h2>
    </div>
    <div class="header-right">
      <span class="user-chip" id="userChip"></span>
    </div>
  </div>
  <div class="menu-dropdown" id="menuDropdown"></div>
  <div class="content" id="todoContent" style="display:none"></div>
  <div class="content" id="mainContent"></div>
  <div class="content" id="memberContent" style="display:none"></div>
  <div class="content" id="dmContent" style="display:none"></div>
  <div class="content" id="sloganContent" style="display:none"></div>
  <div class="content" id="plateContent" style="display:none"></div>
  <div class="content" id="signinContent" style="display:none"></div>
  <div class="content" id="guestTrackContent" style="display:none"></div>
  <div class="content" id="placardContent" style="display:none"></div>
  <div class="content" id="scheduleContent" style="display:none"></div>
  <div class="content" id="financeContent" style="display:none"></div>
  <div class="content" id="meetingContent" style="display:none"></div>
</div>
<button id="backToTop" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="回到頂端">&#8679;</button>

<div class="toast" id="toast"></div>

<script src="src/core.js?v=20260504aa"></script>
<script src="src/gate.js?v=20260506c"></script>
<script src="src/auth.js?v=20260506c"></script>
<script src="src/main.js?v=20260504j"></script>
<script src="src/settings.js?v=20260507a"></script>
<script src="src/tabs-todo.js?v=20260504z"></script>
<script src="src/member.js?v=20260507e"></script>
<script src="src/dm.js?v=20260504x"></script>
<script src="src/slogan.js?v=20260507g"></script>
<script src="src/plate.js?v=20260507g"></script>
<script src="src/signin.js?v=20260507c"></script>
<script src="src/guest.js?v=20260504b"></script>
<script src="src/placard.js?v=20260504v"></script>
<script src="src/schedule.js?v=20260505o"></script>
<script src="src/finance.js?v=20260502b"></script>
<script src="src/meeting.js?v=20260504v"></script>
</body>
</html>
