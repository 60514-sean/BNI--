<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>BNI-秘書財務小組</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="styles/base.css?v=20260504b">
</head>
<body>

<!-- LOADER -->
<div class="loader-overlay" id="loader">
  <div class="loader-spinner"></div>
  <div class="loader-text" id="loaderText">載入中...</div>
</div>

<!-- LOGIN -->
<div class="login-page" id="loginPage">
  <div class="login-box">
    <h1>秘書財務小組</h1>
    <p>請輸入您的名稱登入</p>
    <input type="text" id="nameInput" placeholder="輸入姓名" autocomplete="off">
    <button class="btn-login" onclick="doLogin()">登 入</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- APP -->
<div class="app" id="appPage">
  <div class="header">
    <div class="header-left">
      <h2 id="headerTitle">秘書財務小組</h2>
    </div>
    <div class="header-right">
      <span class="user-chip" id="userChip"></span>
      <button class="hbtn" id="settingsBtn" style="display:none" onclick="openSettings()">設定</button>
      <button class="hbtn" onclick="doLogout()">登出</button>
    </div>
  </div>
  <div class="page-tabs" id="pageTabs" style="display:none">
    <button class="ptab" id="ptab_todo" onclick="switchTab('todo')">待辦<br>事項</button>
    <button class="ptab active" id="ptab_main" onclick="switchTab('main')">工事<br>清單</button>
    <button class="ptab" id="ptab_member" onclick="switchTab('member')">會員<br>資料</button>
    <button class="ptab" id="ptab_dm" onclick="switchTab('dm')">會員<br>DM</button>
    <button class="ptab" id="ptab_signin" onclick="switchTab('signin')">出席<br>簽到</button>
    <button class="ptab" id="ptab_guesttrack" onclick="switchTab('guesttrack')">來賓<br>追蹤</button>
    <button class="ptab" id="ptab_placard" onclick="switchTab('placard')">桌牌<br>製作</button>
    <button class="ptab" id="ptab_finance" onclick="switchTab('finance')">財務<br>控管</button>
    <button class="ptab" id="ptab_meeting" onclick="switchTab('meeting')">例會<br>流程</button>
  </div>
  <div class="content" id="todoContent" style="display:none"></div>
  <div class="content" id="mainContent"></div>
  <div class="content" id="memberContent" style="display:none"></div>
  <div class="content" id="dmContent" style="display:none"></div>
  <div class="content" id="signinContent" style="display:none"></div>
  <div class="content" id="guestTrackContent" style="display:none"></div>
  <div class="content" id="placardContent" style="display:none"></div>
  <div class="content" id="financeContent" style="display:none"></div>
  <div class="content" id="meetingContent" style="display:none"></div>
</div>
<button id="backToTop" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="回到頂端">&#8679;</button>

<div class="toast" id="toast"></div>

<script src="src/core.js?v=20260502b"></script>
<script src="src/auth.js?v=20260502b"></script>
<script src="src/main.js?v=20260502b"></script>
<script src="src/settings.js?v=20260504c"></script>
<script src="src/tabs-todo.js?v=20260502b"></script>
<script src="src/member.js?v=20260502b"></script>
<script src="src/dm.js?v=20260502b"></script>
<script src="src/signin.js?v=20260502b"></script>
<script src="src/guest.js?v=20260504b"></script>
<script src="src/placard.js?v=20260502b"></script>
<script src="src/finance.js?v=20260502b"></script>
<script src="src/meeting.js?v=20260504d"></script>
</body>
</html>
