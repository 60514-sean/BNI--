<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>BNI-秘財週行程</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root {
  --red: #c0392b; --red-dark: #922b21; --red-light: #f9ecec;
  --green: #27ae60; --gray: #7f8c8d;
  --gray-light: #f4f6f8; --gray-border: #e8ecf0;
  --text: #1a1a2e; --text-soft: #6b7280;
  --shadow: 0 2px 12px rgba(0,0,0,0.08);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
  --radius: 14px; --radius-sm: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans TC', sans-serif; background: #f0f2f7; color: var(--text); min-height: 100vh; }

/* LOADER */
.loader-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.85); display: none; align-items: center; justify-content: center; z-index: 9999; flex-direction: column; gap: 12px; }
.loader-overlay.show { display: flex; }
.loader-spinner { width: 36px; height: 36px; border: 4px solid #eee; border-top-color: var(--red); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loader-text { color: var(--red); font-size: 15px; }

/* LOGIN */
.login-page {
  display: flex; min-height: 100vh;
  background: linear-gradient(135deg, #c0392b 0%, #6d1414 100%);
  align-items: center; justify-content: center; padding: 20px;
  position: relative; overflow: hidden;
}
.login-page::before {
  content: ''; position: absolute; inset: 0;
  background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
}
.login-box {
  background: white; border-radius: 24px; padding: 44px 36px;
  width: 100%; max-width: 400px;
  box-shadow: 0 24px 64px rgba(0,0,0,0.3); position: relative; z-index: 1;
}
.login-box h1 { font-size: 22px; font-weight: 900; color: var(--red); text-align: center; margin-bottom: 6px; }
.login-box p { color: var(--text-soft); font-size: 14px; text-align: center; margin-bottom: 32px; }
.login-box input {
  width: 100%; padding: 14px 18px; border: 2px solid var(--gray-border);
  border-radius: var(--radius-sm); font-size: 16px; font-family: inherit;
  outline: none; transition: border 0.2s; margin-bottom: 14px;
}
.login-box input:focus { border-color: var(--red); }
.btn-login {
  width: 100%; padding: 14px; background: var(--red); color: white;
  border: none; border-radius: var(--radius-sm); font-size: 16px; font-weight: 700;
  cursor: pointer; font-family: inherit; transition: all 0.2s; letter-spacing: 0.5px;
}
.btn-login:hover { background: var(--red-dark); transform: translateY(-1px); }
.login-error { color: var(--red); font-size: 13px; margin-top: 8px; text-align: center; min-height: 20px; }

/* APP */
.app { display: none; min-height: 100vh; flex-direction: column; }
.header {
  background: var(--red); color: white; padding: 14px 20px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 2px 16px rgba(192,57,43,0.35);
}
.header-left { display: flex; align-items: center; gap: 12px; }
.header h2 { font-size: 17px; font-weight: 700; }
.header-right { display: flex; align-items: center; gap: 8px; }
.user-chip { background: rgba(255,255,255,0.2); border-radius: 20px; padding: 5px 14px; font-size: 13px; font-weight: 500; }
.hbtn { background: rgba(255,255,255,0.18); border: none; color: white; padding: 6px 13px; border-radius: 7px; cursor: pointer; font-size: 13px; font-family: inherit; }
.hbtn:hover { background: rgba(255,255,255,0.28); }
.content { padding: 18px; max-width: 900px; margin: 0 auto; width: 100%; }

/* DATE BANNER */
.date-banner {
  background: white; border-radius: var(--radius);
  padding: 16px 22px; margin-bottom: 12px; box-shadow: var(--shadow);
  display: flex; align-items: baseline; gap: 12px;
}
.date-main { font-size: 20px; font-weight: 900; color: var(--red); font-family: 'DM Mono', monospace; }
.date-weekday { font-size: 14px; color: var(--text-soft); font-weight: 500; }

/* SUMMARY */
.summary-row {
  display: grid; grid-template-columns: 1fr 1fr 1fr;
  gap: 12px; margin-bottom: 16px;
}
.summary-card {
  background: white; border-radius: var(--radius);
  padding: 18px 20px; box-shadow: var(--shadow);
}
.summary-label {
  font-size: 12px; color: var(--text-soft);
  margin-bottom: 8px; font-weight: 500; letter-spacing: 0.3px;
}
.summary-value {
  font-size: 30px; font-weight: 900; color: var(--red);
  font-family: 'DM Mono', monospace; line-height: 1;
}
.summary-bar-wrap { background: #f0f0f0; border-radius: 4px; height: 6px; margin-top: 10px; }
.summary-bar-fill { height: 6px; border-radius: 4px; background: linear-gradient(90deg, var(--red), #e74c3c); transition: width 0.5s; }

/* DAY TABS */
.day-tabs { display: flex; gap: 6px; margin-bottom: 14px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.day-tabs::-webkit-scrollbar { display: none; }
.day-tab { flex-shrink: 0; }
.day-tab {
  padding: 7px 14px; border-radius: 20px;
  border: 2px solid var(--gray-border);
  background: white; color: var(--text-soft);
  cursor: pointer; font-size: 13px; font-weight: 500;
  transition: all 0.2s; font-family: inherit;
}
.day-tab:hover { border-color: var(--red); color: var(--red); }
.day-tab.active { border-color: var(--red); background: var(--red); color: white; }
.day-tab.today-tab {
  border: 2.5px solid var(--red); color: var(--red); font-weight: 700;
  box-shadow: 0 0 0 2px rgba(192,57,43,0.15);
}
.day-tab.today-tab.active {
  background: var(--red); color: white;
  box-shadow: 0 0 0 3px rgba(192,57,43,0.25);
}
.dot-count { display: inline-block; background: rgba(255,255,255,0.3); border-radius: 10px; padding: 0 6px; font-size: 11px; margin-left: 4px; }
.day-tab:not(.active) .dot-count { background: var(--gray-border); color: var(--text-soft); }
.today-badge { font-size: 9px; background: var(--red); color: white; border-radius: 6px; padding: 1px 5px; margin-left: 3px; vertical-align: middle; }
.day-tab.active .today-badge { background: rgba(255,255,255,0.35); }

/* TASKS */
.tasks-section { display: flex; flex-direction: column; gap: 10px; }
.task-card { background: white; border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; transition: box-shadow 0.2s; }
.task-card:hover { box-shadow: var(--shadow-lg); }
.task-card.done-card { opacity: 0.7; }
.task-card-header { padding: 14px 18px 10px; display: flex; align-items: flex-start; gap: 12px; }
.task-cb { width: 22px; height: 22px; flex-shrink: 0; accent-color: var(--red); cursor: pointer; margin-top: 2px; }
.task-cb:disabled { opacity: 0.4; cursor: default; }
.task-main { flex: 1; }
.task-title { font-size: 15px; font-weight: 500; line-height: 1.5; color: var(--text); }
.task-title.done { text-decoration: line-through; color: #bbb; }
.task-meta { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
.tag { font-size: 11px; padding: 2px 10px; border-radius: 12px; font-weight: 500; }
.tag-owner { background: #eaf4fd; color: #1a6fa0; }
.tag-category { background: var(--red-light); color: var(--red); }
.tag-freq { background: #f0f0f0; color: #888; }
.task-expand-btn { background: none; border: 2px solid transparent; border-radius: 50%; cursor: pointer; color: var(--text-soft); font-size: 16px; padding: 3px; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; transition: transform 0.2s, color 0.2s, border-color 0.2s; flex-shrink: 0; }
.task-expand-btn.open { transform: rotate(180deg); }
.task-expand-btn.has-note { color: var(--red); border-color: var(--red); }
.task-detail { padding: 0 18px 14px 52px; display: none; }
.task-detail.open { display: block; }
.task-note-label { font-size: 12px; color: var(--text-soft); margin-bottom: 5px; font-weight: 500; }
.task-note { width: 100%; padding: 9px 12px; border: 1.5px solid var(--gray-border); border-radius: var(--radius-sm); font-size: 13px; font-family: inherit; resize: none; outline: none; min-height: 60px; background: var(--gray-light); color: var(--text); }
.task-note:focus { border-color: var(--red); background: white; }
.task-note::placeholder { color: #c0c0c0; }
.task-done-info { font-size: 12px; color: var(--green); margin-top: 6px; }


/* SETTINGS */
.card { background: white; border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; margin-bottom: 16px; }
.card-title { font-size: 15px; font-weight: 700; color: var(--red); margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid var(--gray-border); }
.form-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.form-row input { flex: 1; min-width: 120px; padding: 9px 13px; border: 1.5px solid var(--gray-border); border-radius: var(--radius-sm); font-size: 14px; font-family: inherit; outline: none; }
.form-row input:focus { border-color: var(--red); }
.hint { font-size: 12px; color: #aaa; margin-top: 4px; }
.btn { border: none; padding: 10px 22px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; }
.btn-primary { background: var(--red); color: white; }
.btn-secondary { background: var(--gray); color: white; }
.btn-danger { background: none; border: 1.5px solid #e0e0e0; color: #e74c3c; padding: 7px 12px; font-size: 12px; border-radius: 6px; cursor: pointer; font-family: inherit; }
.add-btn { display: flex; align-items: center; gap: 6px; background: none; border: 2px dashed var(--red); color: var(--red); padding: 8px 16px; border-radius: var(--radius-sm); cursor: pointer; font-size: 14px; font-family: inherit; margin-top: 6px; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }

/* TOAST */
.toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(20px); background: #1a1a2e; color: white; padding: 12px 24px; border-radius: 10px; font-size: 14px; z-index: 9999; display: none; opacity: 0; transition: all 0.3s; white-space: nowrap; box-shadow: 0 4px 20px rgba(0,0,0,0.25); }
.toast.show { display: block; opacity: 1; transform: translateX(-50%) translateY(0); }

/* SAVE BUTTON */
.page-save-btn { width: 100%; padding: 14px; background: var(--red); color: white; border: none; border-radius: var(--radius-sm); font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; margin-top: 16px; transition: all 0.2s; }
.page-save-btn:hover { background: var(--red-dark); }
.page-save-btn:disabled { opacity: 0.6; cursor: default; }

@media(max-width: 640px) {
  .content { padding: 12px; }
}

/* PAGE TABS */
.page-tabs {
  display: flex; gap: 10px; padding: 14px 18px 0;
  max-width: 900px; margin: 0 auto; width: 100%;
}
.ptab {
  width: 90px; height: 72px; border-radius: 12px;
  border: 2px solid var(--gray-border);
  background: white; color: var(--text-soft);
  cursor: pointer; font-size: 13px; font-weight: 700;
  font-family: inherit; transition: all 0.2s;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 4px;
  line-height: 1.3;
}
.ptab:hover { border-color: var(--red); color: var(--red); }
.ptab.active { border-color: var(--red); background: var(--red); color: white; box-shadow: 0 4px 14px rgba(192,57,43,0.25); }
.ptab-icon { font-size: 20px; }

/* MEMBER PAGE */
.member-search {
  width: 100%; padding: 12px 16px; margin-bottom: 14px;
  border: 1.5px solid var(--gray-border); border-radius: var(--radius-sm);
  font-size: 15px; font-family: inherit; outline: none;
  background: white; transition: border 0.2s; display: block;
}
.member-search:focus { border-color: var(--red); }
.member-grid { display: flex; flex-direction: column; gap: 10px; }
.member-card {
  background: white; border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 16px 18px; display: flex; align-items: flex-start;
  justify-content: space-between; gap: 12px;
}
.member-info { flex: 1; min-width: 0; }
.member-name { font-size: 17px; font-weight: 900; color: var(--text); margin-bottom: 5px; }
.member-specialty {
  display: inline-block; background: var(--red-light); color: var(--red);
  font-size: 12px; font-weight: 700; padding: 2px 10px;
  border-radius: 12px; margin-bottom: 8px;
}
.member-row { font-size: 13px; color: var(--text-soft); margin-bottom: 3px; line-height: 1.5; }
.member-phone-link { color: var(--text); font-weight: 600; text-decoration: none; font-size: 14px; }
.member-phone-link:hover { color: var(--red); }
.member-edit-btn {
  flex-shrink: 0; background: none; border: 1.5px solid var(--gray-border);
  color: var(--text-soft); padding: 6px 12px; border-radius: 7px;
  cursor: pointer; font-size: 12px; font-family: inherit; transition: all 0.2s; margin-top: 2px;
}
.member-edit-btn:hover { border-color: var(--red); color: var(--red); }

/* MEMBER EDIT MODAL */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.45);
  display: flex; align-items: flex-end; justify-content: center;
  z-index: 9000;
}
.modal-box {
  background: white; border-radius: 20px 20px 0 0;
  width: 100%; max-width: 600px; padding: 28px 22px 36px;
  max-height: 88vh; overflow-y: auto;
}
.modal-title { font-size: 17px; font-weight: 900; color: var(--red); margin-bottom: 20px; }
.modal-field { margin-bottom: 14px; }
.modal-label { font-size: 12px; color: var(--text-soft); font-weight: 600; margin-bottom: 5px; }
.modal-input {
  width: 100%; padding: 11px 14px; border: 1.5px solid var(--gray-border);
  border-radius: var(--radius-sm); font-size: 15px; font-family: inherit;
  outline: none; transition: border 0.2s;
}
.modal-input:focus { border-color: var(--red); }
.modal-btns { display: flex; gap: 10px; margin-top: 20px; }
.modal-save {
  flex: 1; padding: 13px; background: var(--red); color: white;
  border: none; border-radius: var(--radius-sm); font-size: 15px;
  font-weight: 700; cursor: pointer; font-family: inherit;
}
.modal-cancel {
  padding: 13px 18px; background: none; border: 1.5px solid var(--gray-border);
  color: var(--text-soft); border-radius: var(--radius-sm); font-size: 15px;
  cursor: pointer; font-family: inherit;
}
</style>
</head>
<body>

<!-- LOADER -->
<div class="loader-overlay" id="loader">
  <div class="loader-spinner"></div>
  <div class="loader-text" id="loaderText">載入中...</div>
</div>

<!-- LOGIN -->
<div class="login-page" id="loginPage">
  <div class="login-box">
    <h1>每週工事追蹤</h1>
    <p>請輸入您的名稱登入</p>
    <input type="text" id="nameInput" placeholder="輸入姓名（如：康康）" autocomplete="off">
    <button class="btn-login" onclick="doLogin()">登 入</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- APP -->
<div class="app" id="appPage">
  <div class="header">
    <div class="header-left">
      <h2 id="headerTitle">每週工事追蹤</h2>
    </div>
    <div class="header-right">
      <span class="user-chip" id="userChip"></span>
      <button class="hbtn" id="settingsBtn" style="display:none" onclick="showSettings()">設定</button>
      <button class="hbtn" onclick="doLogout()">登出</button>
    </div>
  </div>
  <div class="page-tabs" id="pageTabs" style="display:none">
    <button class="ptab active" id="ptab_main" onclick="switchTab('main')">工事<br>清單</button>
    <button class="ptab" id="ptab_member" onclick="switchTab('member')">會員<br>資料</button>
  </div>
  <div class="content" id="mainContent"></div>
  <div class="content" id="memberContent" style="display:none"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== API =====
const API_URL = 'https://script.google.com/macros/s/AKfycbzwn_oKfa0vs21GlWdqtjz0oFJYyNwhVGJQPz_GHRaDGmk6jxHIqs7U0yqrVxyzkwK-/exec';
const LS_KEY  = 'bni_weekly_v1';

let cache = {};
try { const s = localStorage.getItem(LS_KEY); if (s) cache = JSON.parse(s); } catch {}

function _lsSave() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(cache)); } catch {}
}

let _refreshP = null;
async function _bgRefresh() {
  if (_refreshP) return _refreshP;
  _refreshP = fetch(API_URL, { signal: AbortSignal.timeout(8000) })
    .then(r => r.json())
    .then(j => { if (j?.data) { cache = j.data; _lsSave(); } })
    .catch(() => {})
    .finally(() => { _refreshP = null; });
  return _refreshP;
}
_bgRefresh();

async function _syncAndRender() {
  await _bgRefresh();
  if (!CU) return;
  if (document.activeElement?.tagName === 'TEXTAREA') return;
  renderMain();
}

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && CU) _syncAndRender();
});

setInterval(() => { if (CU && !document.hidden) _syncAndRender(); }, 30000);

const _saveQueue = new Map();
let _saveRunning = false;

async function _drainSaveQueue() {
  if (_saveRunning || _saveQueue.size === 0) return;
  _saveRunning = true;
  const [[key, data]] = _saveQueue;
  _saveQueue.delete(key);
  try {
    await fetch(API_URL, {
      method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ key, data })
    });
  } catch {}
  _saveRunning = false;
  _drainSaveQueue();
}

async function apiSave(key, data) {
  cache[key] = data;
  _lsSave();
  _saveQueue.set(key, data);
  _drainSaveQueue();
}

// ===== WEEK KEY（每週六深夜自動重置，週日 00:00 起為新週）=====
function getWeekKey() {
  const d = new Date();
  // 找本週週日（day=0），以週日日期為週次識別碼
  const sunday = new Date(d);
  sunday.setDate(d.getDate() - d.getDay());
  const y  = sunday.getFullYear();
  const m  = String(sunday.getMonth() + 1).padStart(2, '0');
  const dd = String(sunday.getDate()).padStart(2, '0');
  return `${y}-${m}-${dd}`;
}

// ===== CONFIG =====
const DEFAULT_USERS = ['康康', '麥莉', '報到組員', '簡報顧問'];
const DEFAULT_ADMIN = '康康';

function getConfig() {
  const c = cache['__config__'];
  if (c && c.adminPassword) return c;
  return { adminPassword: DEFAULT_ADMIN, users: [...DEFAULT_USERS] };
}
async function saveConfigData(cfg) { await apiSave('__config__', cfg); }

// ===== PROGRESS & NOTES =====
function getProgData()  { return cache[`__prog_${getWeekKey()}__`] || {}; }
async function saveProgData(d)  { await apiSave(`__prog_${getWeekKey()}__`, d); }

function getNoteData()  { return cache[`__notes_${getWeekKey()}__`] || {}; }
async function saveNoteData(d)  { await apiSave(`__notes_${getWeekKey()}__`, d); }

// ===== TASK DATA =====
// id 為永久固定識別碼，不可更改，新增任務請使用新的 id
const TASK_DATA = [
  { id:1,  day:'週日', owner:'康康',    task:'提醒EDM手，週一繳交3張PPT圖<br>1.未來6周簡報主題簡報預告<br>2.當周、下周16:9主題簡報EDM',  cat:'例會',    freq:'每週' },
  { id:2,  day:'週日', owner:'康康',    task:'查看三個月內會員有誰，並提醒續約',                   cat:'續約',    freq:'每週' },
  { id:3,  day:'週日', owner:'簡報顧問', task:'每週簡報工作進度回報',                              cat:'簡報',    freq:'每週' },
  { id:4,  day:'週日', owner:'簡報顧問', task:'提醒顧問於中午12:00前填寫顧問輔導表',                 cat:'簡報',    freq:'每週' },
  { id:5,  day:'週日', owner:'康康',    task:'確認八週內皆有簡報人選',                             cat:'簡報',    freq:'每週' },

async function doLogin() {
  const name = document.getElementById('nameInput').value.trim();
  if (!name) return;

  // 先用 localStorage cache 即時驗證，不等 API
  let cfg = getConfig();
  let isAdmin = name === cfg.adminPassword;
  let isUser  = cfg.users.includes(name) || isAdmin;

  // cache 找不到時才等 API（新使用者或首次開啟）
  if (!isUser) {
    await Promise.race([_bgRefresh(), new Promise(r => setTimeout(r, 3000))]);
    cfg     = getConfig();
    isAdmin = name === cfg.adminPassword;
    isUser  = cfg.users.includes(name) || isAdmin;
  } else {
    _bgRefresh(); // 背景靜默更新，不阻塞登入
  }

  if (!isUser) { document.getElementById('loginError').textContent = '找不到此姓名，請確認後重試'; return; }
  CU = name; CR = isAdmin ? 'admin' : 'user';
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('appPage').style.display = 'flex';
  document.getElementById('userChip').textContent = name;
  document.getElementById('settingsBtn').style.display = isAdmin ? 'inline-block' : 'none';
  document.getElementById('pageTabs').style.display = 'flex';
  currentDay = TODAY_DAY;
  _activeTab = 'main';
  switchTab('main');
}

  CU = null; CR = null;

  document.getElementById('pageTabs').style.display = 'none';

async function toggleTask(idx, cb) {
  const prog = getProgData();
  prog[idx] = cb.checked;
  saveProgData(prog);

  const ttl = document.getElementById('ttl_' + idx);
  if (ttl) {
    ttl.style.textDecoration = cb.checked ? 'line-through' : '';
    ttl.style.color = cb.checked ? '#bbb' : 'var(--text)';
  }

  const t      = TASK_DATA[idx];
  const dayKey = currentDay === '全部' ? t.day : currentDay;
  const vis    = CR === 'admin' ? TASK_DATA : TASK_DATA.filter(t2 => t2.owner === CU);
  const catTasks = vis.filter(t2 => t2.cat === t.cat && t2.day === t.day);
  const catDone  = catTasks.filter(t2 => prog[TASK_IDX.get(t2)]).length;
  const badge = document.getElementById(`catbadge_cat_${dayKey}_${t.cat}`);

  // 全部頁同步更新日期徽章
  if (currentDay === '全部') {
    const dayTasks = vis.filter(t2 => t2.day === t.day);
    const dayDone  = dayTasks.filter(t2 => prog[TASK_IDX.get(t2)]).length;
    const dayBadge = document.getElementById(`catbadge_day_${t.day}`);
    if (dayBadge) dayBadge.textContent = `${dayDone}/${dayTasks.length}`;
  }

  const total = vis.length;
  const done  = vis.filter(t2 => prog[TASK_IDX.get(t2)]).length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progBar').style.width  = pct + '%';

  document.getElementById('valPend').textContent  = total - done;
  document.getElementById('valPct').textContent   = pct + '%';
  showToast(cb.checked ? '已完成' : '已取消');
}

let _memberData = null;

function _parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"' && text[i+1] === '"') { field += '"'; i++; }
      else if (c === '"') { inQ = false; }
      else { field += c; }
    } else {
      if (c === '"') { inQ = true; }
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (c === '\r') { /* skip */ }
      else { field += c; }
    }
  }
  if (field || row.length) { row.push(field); rows.push(row); }
  return rows;
}

async function fetchMembers() {
  document.getElementById('memberContent').innerHTML = `<div style="text-align:center;padding:48px 20px;color:var(--text-soft);">載入中...</div>`;
  try {
    const r = await fetch(MEMBER_CSV + '&t=' + Date.now());
    const rows = _parseCSV(await r.text());
    if (rows.length < 2) { _memberData = []; return; }
    const headers = rows[0];
    const idx = name => headers.findIndex(h => h.includes(name));
    const iName = idx('姓名'), iSpec = idx('專業別'), iComp = idx('公司'), iPhone = idx('電話'), iServ = idx('服務');
    const iDays = idx('到期續約天數'), iStatus = idx('續約狀態'), iDate = idx('到期日');
    const iApply = idx('申請書'), iPay = idx('繳費'), iComplete = idx('完成續約'), iRibbon = idx('綢帶');

    _memberData = rows.slice(1)
      .map((r, i) => ({
        sheetRow:    i + 2,
        name:        r[iName]?.trim()     || '',
        specialty:   r[iSpec]?.trim()     || '',
        company:     r[iComp]?.trim()     || '',
        phone:       r[iPhone]?.trim()    || '',
        service:     r[iServ]?.trim()     || '',
        renewDays:   r[iDays]?.trim()     || '',
        renewStatus: r[iStatus]?.trim()   || '',
        renewDate:   r[iDate]?.trim()     || '',
        renewApply:  r[iApply]?.trim()    || '',
        renewPay:    r[iPay]?.trim()      || '',
        renewComplete: r[iComplete]?.trim() || '',
        renewRibbon: r[iRibbon]?.trim()   || '',
      }))
      .filter(m => m.name);
  } catch(e) {
    document.getElementById('memberContent').innerHTML = `<div style="text-align:center;padding:48px 20px;color:var(--red);">載入失敗，請重試</div>`;
    _memberData = null;
  }
}

let _memberSearch = '';
let _memberFilter = ''; // '' | '120' | '90'

async function renderMembers() {
  if (!_memberData) await fetchMembers();
  if (!_memberData) return;
  const q = _memberSearch.toLowerCase();
  let list = q
    ? _memberData.filter(m => m.name.includes(q) || m.specialty.includes(q) || m.company.includes(q))
    : _memberData;
  if (_memberFilter === '120') list = list.filter(m => { const d = parseInt(m.renewDays); return d >= 90 && d <= 119; });
  if (_memberFilter === '90')  list = list.filter(m => parseInt(m.renewDays) <= 89);
  const canEdit = CR === 'admin';
  const btnStyle = (f, bg, color) => `padding:7px 12px;border:none;border-radius:7px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;background:${_memberFilter===f?bg:'white'};color:${_memberFilter===f?color:bg};border:1.5px solid ${bg};`;
  let html = `<div style="display:flex;gap:8px;margin-bottom:14px;align-items:center;">
    <input class="member-search" type="text" placeholder="搜尋姓名、專業別、公司..." value="${_escH(_memberSearch)}" oninput="_memberSearch=this.value;renderMembers()" autocomplete="off" style="margin-bottom:0;flex:1;">
    <button onclick="_memberData=null;renderMembers()" style="flex-shrink:0;padding:11px 14px;background:white;border:1.5px solid var(--gray-border);border-radius:var(--radius-sm);cursor:pointer;font-size:13px;font-family:inherit;color:var(--text-soft);">重整</button>
  </div>`;
  html += `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px;">
    <span style="font-size:13px;color:var(--text-soft);">${list.length} 位會員</span>
    <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
      <button onclick="_memberFilter=_memberFilter==='120'?'':'120';renderMembers()" style="${btnStyle('120','#d4ac0d','white')}">120天</button>
      <button onclick="_memberFilter=_memberFilter==='90'?'':'90';renderMembers()"  style="${btnStyle('90','#c0392b','white')}">90天</button>
      ${canEdit ? `<button onclick="openAddMember()" style="padding:7px 16px;background:var(--red);color:white;border:none;border-radius:7px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;">+ 新增會員</button>` : ''}
    </div>
  </div>`;
  html += `<div class="member-grid">`;
  list.forEach(m => {
    html += `<div class="member-card">
      <div class="member-info" style="flex:1;min-width:0;">
        <div class="member-name">${_escH(m.name)}</div>
        <div><span class="member-specialty">${_escH(m.specialty)}</span></div>
        <div class="member-row">${_escH(m.company)}</div>
        <div class="member-row"><a class="member-phone-link" href="tel:${_escH(m.phone)}">${_escH(m.phone)}</a></div>
        <div class="member-row">${_escH(m.service)}</div>
      </div>
      <div style="flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;gap:6px;align-self:stretch;">
        ${canEdit ? `<button class="member-edit-btn" data-row="${m.sheetRow}" onclick="openEditMember(this.dataset.row)">編輯</button>` : '<div></div>'}
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:3px;">
          ${m.renewDays ? `<span style="font-size:12px;font-weight:700;padding:2px 8px;border-radius:20px;background:${parseInt(m.renewDays)>=120?'#eaf7ee':parseInt(m.renewDays)>=90?'#fef9e7':'#fdecea'};color:${parseInt(m.renewDays)>=120?'#27ae60':parseInt(m.renewDays)>=90?'#d4ac0d':'#c0392b'};">${_escH(m.renewDays)}天</span>` : ''}
          ${m.renewStatus==='TRUE' ? `<span style="font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:#eaf7ee;color:#27ae60;">已續約</span>` : `<span style="font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:#fdecea;color:#c0392b;">未續約</span>`}
          ${m.renewDate ? `<span style="font-size:11px;color:var(--text-soft);white-space:nowrap;">到期：${_escH(m.renewDate)}</span>` : ''}
        </div>
      </div>
    </div>`;
  });
  html += `</div>`;
  if (list.length === 0 && _memberData.length > 0) html = `<div style="display:flex;gap:8px;margin-bottom:14px;"><input class="member-search" type="text" placeholder="搜尋姓名、專業別、公司..." value="${_escH(_memberSearch)}" oninput="_memberSearch=this.value;renderMembers()" autocomplete="off" style="margin-bottom:0;flex:1;"><button onclick="_memberData=null;renderMembers()" style="flex-shrink:0;padding:11px 14px;background:white;border:1.5px solid var(--gray-border);border-radius:var(--radius-sm);cursor:pointer;font-size:13px;font-family:inherit;color:var(--text-soft);">重整</button></div><div style="text-align:center;padding:48px 20px;color:var(--text-soft);">查無結果</div>`;
  document.getElementById('memberContent').innerHTML = html;
}

function _escH(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function openEditMember(sheetRow) {
  sheetRow = parseInt(sheetRow);
  const m = _memberData.find(x => x.sheetRow === sheetRow);
  if (!m) return;
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'memberModal';
  overlay.innerHTML = `
    <div class="modal-box">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
        <div class="modal-title" style="margin-bottom:0;">編輯會員資料</div>
        <button onclick="confirmDeleteMemberByRow(${sheetRow},'${_escH(m.name)}')" style="padding:5px 12px;background:white;border:1.5px solid #e74c3c;color:#e74c3c;border-radius:6px;font-size:13px;cursor:pointer;font-family:inherit;font-weight:600;">刪除</button>
      </div>
      <div class="modal-field"><div class="modal-label">姓名</div><input class="modal-input" id="mf_name" value="${_escH(m.name)}"></div>
      <div class="modal-field"><div class="modal-label">專業別</div><input class="modal-input" id="mf_spec" value="${_escH(m.specialty)}"></div>
      <div class="modal-field"><div class="modal-label">公司或品牌名稱</div><input class="modal-input" id="mf_comp" value="${_escH(m.company)}"></div>
      <div class="modal-field"><div class="modal-label">電話</div><input class="modal-input" id="mf_phone" type="tel" value="${_escH(m.phone)}"></div>
      <div class="modal-field"><div class="modal-label">服務項目</div><input class="modal-input" id="mf_serv" value="${_escH(m.service)}"></div>
      <div style="border-top:1px solid var(--gray-border);margin:14px 0 10px;padding-top:12px;">
        <div class="modal-label" style="margin-bottom:10px;">續約資訊</div>
        <div class="modal-field"><div class="modal-label">到期日</div><input class="modal-input" id="mf_renewDate" value="${_escH(m.renewDate)}"></div>
        <div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:4px;">
          <label style="display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer;"><input type="checkbox" id="mf_renewStatus"   ${m.renewStatus==='TRUE'?'checked':''}>續約狀態</label>
          <label style="display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer;"><input type="checkbox" id="mf_renewApply"    ${m.renewApply==='TRUE'?'checked':''}>申請書</label>
          <label style="display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer;"><input type="checkbox" id="mf_renewPay"      ${m.renewPay==='TRUE'?'checked':''}>繳費</label>
          <label style="display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer;"><input type="checkbox" id="mf_renewComplete" ${m.renewComplete==='TRUE'?'checked':''}>完成續約</label>
          <label style="display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer;"><input type="checkbox" id="mf_renewRibbon"   ${m.renewRibbon==='TRUE'?'checked':''}>綢帶/頒獎</label>
        </div>
      </div>
      <div class="modal-btns">
        <button class="modal-save" onclick="saveMemberEdit(${sheetRow})">儲存</button>
        <button class="modal-cancel" onclick="closeEditMember()">取消</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
}

function confirmDeleteMemberByRow(sheetRow, name) {
  closeEditMember();
  deleteMember(parseInt(sheetRow), name);
}

function closeEditMember() {
  document.getElementById('memberModal')?.remove();
}

function openAddMember() {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'memberModal';
  overlay.innerHTML = `
    <div class="modal-box">
      <div class="modal-title">新增會員</div>
      <div class="modal-field"><div class="modal-label">姓名</div><input class="modal-input" id="mf_name" placeholder="輸入姓名"></div>
      <div class="modal-field"><div class="modal-label">專業別</div><input class="modal-input" id="mf_spec" placeholder="輸入專業別"></div>
      <div class="modal-field"><div class="modal-label">公司或品牌名稱</div><input class="modal-input" id="mf_comp" placeholder="輸入公司或品牌名稱"></div>
      <div class="modal-field"><div class="modal-label">電話</div><input class="modal-input" id="mf_phone" type="tel" placeholder="輸入電話"></div>
      <div class="modal-field"><div class="modal-label">服務項目</div><input class="modal-input" id="mf_serv" placeholder="輸入服務項目（20字內）"></div>
      <div class="modal-btns">
        <button class="modal-save" onclick="addMember()">新增</button>
        <button class="modal-cancel" onclick="closeEditMember()">取消</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
}

async function addMember() {
  const name = document.getElementById('mf_name').value.trim();
  if (!name) { showToast('請輸入姓名'); return; }
  const payload = {
    action:    'addMember',
    name,
    specialty: document.getElementById('mf_spec').value.trim(),
    company:   document.getElementById('mf_comp').value.trim(),
    phone:     document.getElementById('mf_phone').value.trim(),
    service:   document.getElementById('mf_serv').value.trim(),
  };
  closeEditMember();
  showToast('新增中...');
  try {
    await fetch(API_URL, {
      method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(payload)
    });
    showToast('已新增');
  } catch { showToast('新增失敗，請重試'); }
}

function confirmDeleteMember(btn) {
  const sheetRow = parseInt(btn.dataset.row);
  const name = btn.dataset.name;
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'memberModal';
  overlay.dataset.delRow = sheetRow;
  overlay.dataset.delName = name;
  overlay.innerHTML = `
    <div class="modal-box">
      <div class="modal-title" style="color:#e74c3c;">確認刪除</div>
      <p style="font-size:15px;margin-bottom:8px;">確定要刪除 <strong>${_escH(name)}</strong> 的資料嗎？</p>
      <p style="font-size:13px;color:var(--text-soft);">刪除後雲端試算表中的該筆資料也會一併移除，無法復原。</p>
      <div class="modal-btns" style="margin-top:24px;">
        <button class="modal-save" style="background:#e74c3c;" onclick="deleteMemberFromModal()">確認刪除</button>
        <button class="modal-cancel" onclick="closeEditMember()">取消</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
}

function deleteMemberFromModal() {
  const overlay = document.getElementById('memberModal');
  const sheetRow = parseInt(overlay.dataset.delRow);
  const memberName = overlay.dataset.delName;
  deleteMember(sheetRow, memberName);
}

async function deleteMember(sheetRow, memberName) {
  if (!memberName) {
    const m = _memberData?.find(x => x.sheetRow === sheetRow);
    memberName = m?.name || '';
  }
  closeEditMember();
  if (_memberData) {
    _memberData = _memberData.filter(x => x.sheetRow !== sheetRow);
    _memberData.forEach(m => { if (m.sheetRow > sheetRow) m.sheetRow--; });
  }
  renderMembers();
  showToast('刪除中...');
  try {
    await fetch(API_URL, {
      method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'deleteMember', sheetRow: sheetRow, name: memberName })
    });
    showToast('已刪除');
  } catch { showToast('刪除失敗，請重試'); }
}

async function saveMemberEdit(sheetRow) {
  const m = _memberData.find(x => x.sheetRow === sheetRow);
  if (!m) return;
  const originalName = m.name;
  m.name         = document.getElementById('mf_name').value.trim();
  m.specialty    = document.getElementById('mf_spec').value.trim();
  m.company      = document.getElementById('mf_comp').value.trim();
  m.phone        = document.getElementById('mf_phone').value.trim();
  m.service      = document.getElementById('mf_serv').value.trim();
  m.renewDate    = document.getElementById('mf_renewDate').value.trim();
  m.renewStatus  = document.getElementById('mf_renewStatus').checked ? 'TRUE' : 'FALSE';
  m.renewApply   = document.getElementById('mf_renewApply').checked   ? 'TRUE' : 'FALSE';
  m.renewPay     = document.getElementById('mf_renewPay').checked     ? 'TRUE' : 'FALSE';
  m.renewComplete= document.getElementById('mf_renewComplete').checked ? 'TRUE' : 'FALSE';
  m.renewRibbon  = document.getElementById('mf_renewRibbon').checked  ? 'TRUE' : 'FALSE';

  closeEditMember();
  renderMembers();
  showToast('儲存中...');
  try {
    await Promise.all([
      fetch(API_URL, {
        method: 'POST', mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ action: 'updateMember', sheetRow, originalName, name: m.name, specialty: m.specialty, company: m.company, phone: m.phone, service: m.service })
      }),
      fetch(API_URL, {
        method: 'POST', mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ action: 'updateRenewal', sheetRow, renewDate: m.renewDate, renewStatus: m.renewStatus, renewApply: m.renewApply, renewPay: m.renewPay, renewComplete: m.renewComplete, renewRibbon: m.renewRibbon })
      })
    ]);
    showToast('已儲存');
  } catch { showToast('儲存失敗，請重試'); }
}

// ===== TOAST =====
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// ===== MANUAL SAVE =====
async function manualSave(btn) {
  if (btn) { btn.disabled = true; btn.textContent = '儲存中...'; }
  try {
    const prog  = getProgData();
    const notes = getNoteData();
    await Promise.all([
      fetch(API_URL, { method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'}, body: JSON.stringify({ key: `__prog_${getWeekKey()}__`, data: prog }) }),
      fetch(API_URL, { method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'}, body: JSON.stringify({ key: `__notes_${getWeekKey()}__`, data: notes }) })
    ]);
    _lsSave();
    showToast('已儲存');
  } catch {}
  if (btn) { btn.disabled = false; btn.textContent = '儲存'; }
}
</script>
</body>
</html>
