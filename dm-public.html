<body>

<div class="public-header">
  <h1>BNI億展白金分會</h1>
  <div class="sub">會員介紹 DM</div>
  <select class="jump-select" id="jumpSelect" onchange="jumpToGroup(this.value)" style="display:none;">
    <option value="">跳到產業鏈...</option>
  </select>
</div>

<div class="container" id="content">
  <div class="loader">載入中...</div>
</div>

<button class="back-to-top" id="backToTop" onclick="window.scrollTo({top:0,behavior:'smooth'})" aria-label="回到頂端">&#8679;</button>

<div class="contact-bar">
  <a href="https://www.facebook.com/share/1JDsPW9qMN/?mibextid=wwXIfr" class="contact-btn" target="_blank" rel="noopener">聯絡分會（Facebook 粉專）</a>
</div>

<script>
const VALID_TOKEN = '9k4r7p2m8x5v3t6y';
const PUBLIC_API_URL = 'https://script.google.com/macros/s/AKfycbzwn_oKfa0vs21GlWdqtjz0oFJYyNwhVGJQPz_GHRaDGmk6jxHIqs7U0yqrVxyzkwK-/exec';
const CAT_COLORS = ['#c0392b','#7b6914','#2e6e8e','#7b3f6a','#2e7d52','#b5631a','#5a4a8a','#4a7a5a','#8e3a3a','#3a6a7a'];
const IS_PREVIEW = new URLSearchParams(window.location.search).get('preview') === '1';

function getToken() {
  const params = new URLSearchParams(window.location.search);
  return params.get('t') || '';
}

function escH(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// 來賓識別與「想認識」狀態管理
const GUEST_KEY = 'bni_dm_guest';
const GUEST_TTL_DAYS = 7;
const MEET_KEY = 'bni_dm_meet'; // 已點過想認識的會員名稱陣列

// 行為追蹤：buffer + 批次發送（減少 API 呼叫次數，降低 rate limit 壓力）
let _sessionStart = null; // 本次造訪開始時間（ISO string）
let _visitSent = false;   // 同一個 page lifetime 只送一筆 visit
let _eventBuffer = [];    // 待送出的事件
let _flushTimer = null;   // 批次計時器
const FLUSH_INTERVAL_MS = 2500; // 每 2.5 秒 flush 一次
const FLUSH_SIZE = 5;           // 累積 5 筆就立刻 flush

function nowIso() { return new Date().toISOString(); }

function postBehaviorEvent(payload) {
  if (IS_PREVIEW) return; // 預覽模式不送任何追蹤事件
  _eventBuffer.push(payload);
  if (_eventBuffer.length >= FLUSH_SIZE) {
    flushBehaviorEvents();
  } else if (!_flushTimer) {
    _flushTimer = setTimeout(flushBehaviorEvents, FLUSH_INTERVAL_MS);
  }
}

function flushBehaviorEvents(opts) {
  if (_flushTimer) { clearTimeout(_flushTimer); _flushTimer = null; }
  if (_eventBuffer.length === 0) return;
  const info = getGuestInfo();
  if (!info) { _eventBuffer = []; return; }
  const events = _eventBuffer;
  _eventBuffer = [];
  const body = JSON.stringify({
    action: 'batchBehavior',
    token: VALID_TOKEN,
    phone: info.phone,
    name: info.name,
    events
  });
  const useBeacon = opts && opts.beacon;
  try {
    if (useBeacon && navigator.sendBeacon) {
      const blob = new Blob([body], { type: 'text/plain;charset=utf-8' });
      navigator.sendBeacon(PUBLIC_API_URL, blob);
    } else {
      fetch(PUBLIC_API_URL, {
        method: 'POST',
        keepalive: true,
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body
      }).catch(() => {});
    }
  } catch (e) { /* ignore */ }
}

function sendVisitEnd() {
  if (IS_PREVIEW) return; // 預覽模式不送 visit
  if (_visitSent || !_sessionStart) return;
  const info = getGuestInfo();
  if (!info) return;
  _visitSent = true; // 旗標：本次 page lifetime 已送
  // 把 visit 事件併入 buffer 一起 flush
  _eventBuffer.push({ type: 'visit', startAt: _sessionStart, endAt: nowIso() });
  flushBehaviorEvents({ beacon: true });
}

// 頁面隱藏時送出造訪結束（pagehide 比 beforeunload 在行動瀏覽器更可靠）
window.addEventListener('pagehide', sendVisitEnd, { capture: true });
// 切換到背景（行動裝置上代表使用者離開頁面）也送一次
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') sendVisitEnd();
});

function getGuestInfo() {
  try {
    const raw = localStorage.getItem(GUEST_KEY);
    if (!raw) return null;
    const obj = JSON.parse(raw);
    if (!obj || !obj.name || !obj.phone || !obj.savedAt) return null;
    const ageMs = Date.now() - obj.savedAt;
    if (ageMs > GUEST_TTL_DAYS * 86400 * 1000) { localStorage.removeItem(GUEST_KEY); return null; }
    return obj;
  } catch (e) { return null; }
}
function saveGuestInfo(name, phone) {
  localStorage.setItem(GUEST_KEY, JSON.stringify({ name, phone, savedAt: Date.now() }));
}
function getMeetSet() {
  try { return new Set(JSON.parse(localStorage.getItem(MEET_KEY) || '[]')); }
  catch (e) { return new Set(); }
}
function addMeet(memberName) {
  const s = getMeetSet(); s.add(memberName);
  localStorage.setItem(MEET_KEY, JSON.stringify([...s]));
}
function isMeetClicked(memberName) { return getMeetSet().has(memberName); }
function escAttr(s) { return String(s || '').replace(/[^\w一-龥]/g, '_'); }

function renderMeetBtn(memberName) {
  const done = isMeetClicked(memberName);
  const safe = escAttr(memberName);
  if (done) {
    return `<button class="mc-meet-btn done" disabled id="meet-${safe}">&#10003; 已通知</button>`;
  }
  return `<button class="mc-meet-btn" id="meet-${safe}" data-member="${escH(memberName)}">想認識</button>`;
}

document.addEventListener('click', function (e) {
  if (!e.target.closest) return;

  // 想認識按鈕
  const meetBtn = e.target.closest('.mc-meet-btn');
  if (meetBtn && !meetBtn.classList.contains('done') && !meetBtn.disabled) {
    const memberName = meetBtn.dataset.member;
    if (memberName) onMeetClick(memberName);
    return;
  }

  // 撥電話（tel: 連結）→ 紀錄 phoneClick
  const telLink = e.target.closest('a[href^="tel:"]');
  if (telLink) {
    const card = telLink.closest('.member-card');
    const memberName = card && card.dataset.member;
    if (memberName) {
      postBehaviorEvent({ type: 'phoneClick', member: memberName, at: nowIso() });
    }
    return;
  }

  // 看官網 → 紀錄 webClick
  const webBtn = e.target.closest('a.mc-web-btn');
  if (webBtn) {
    const card = webBtn.closest('.member-card');
    const memberName = card && card.dataset.member;
    if (memberName) {
      postBehaviorEvent({ type: 'webClick', member: memberName, at: nowIso() });
    }
    return;
  }
});

async function onMeetClick(memberName) {
  let info = getGuestInfo();
  if (!info) {
    info = await openGuestModal(memberName);
    if (!info) return;
  }
  await submitInterest(memberName, info);
}

function openGuestModal(forMemberName) {
  return new Promise(resolve => {
    const overlay = document.createElement('div');
    overlay.className = 'guest-modal-overlay';
    overlay.innerHTML = `
      <div class="guest-modal-box">
        <div class="guest-modal-title">想認識 ${escH(forMemberName)}</div>
        <div class="guest-modal-sub">請留下您的姓名與手機，會員會盡快主動聯繫您。資料僅供分會內部追蹤使用。</div>
        <div class="guest-modal-label">姓名</div>
        <input class="guest-modal-input" id="gm_name" autocomplete="name" placeholder="請輸入您的姓名">
        <div class="guest-modal-label">手機</div>
        <input class="guest-modal-input" id="gm_phone" autocomplete="tel" inputmode="numeric" placeholder="例：0912345678">
        <div class="guest-modal-err" id="gm_err"></div>
        <button class="guest-modal-submit" id="gm_submit">送出</button>
      </div>`;
    document.body.appendChild(overlay);
    setTimeout(() => document.getElementById('gm_name')?.focus(), 50);

    document.getElementById('gm_submit').onclick = () => {
      const name = document.getElementById('gm_name').value.trim();
      const phone = document.getElementById('gm_phone').value.trim();
      const errEl = document.getElementById('gm_err');
      if (!name) { errEl.textContent = '請輸入姓名'; return; }
      if (!phone || phone.replace(/\D/g,'').length < 8) { errEl.textContent = '請輸入正確的手機號碼'; return; }
      saveGuestInfo(name, phone);
      overlay.remove();
      resolve({ name, phone });
    };
    [['gm_name','gm_phone'],['gm_phone','gm_submit']].forEach(([from,to]) => {
      document.getElementById(from).onkeydown = (e) => {
        if (e.key === 'Enter') document.getElementById(to).focus();
      };
    });
  });
}

async function submitInterest(memberName, info) {
  const safe = escAttr(memberName);
  const btn = document.getElementById('meet-' + safe);
  const note = document.getElementById('note-' + safe);
  if (btn) { btn.disabled = true; btn.textContent = '送出中...'; }
  try {
    const body = {
      action: 'registerGuestInterest',
      token: VALID_TOKEN,
      name: info.name,
      phone: info.phone,
      memberName
    };
    // 用 text/plain 避開 CORS preflight
    const res = await fetch(PUBLIC_API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body)
    });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || 'register failed');
    addMeet(memberName);
    if (btn) {
      btn.className = 'mc-meet-btn done';
      btn.innerHTML = '&#10003; 已通知';
    }
    if (note) {
      note.textContent = '已通知 ' + memberName + '，會盡快聯繫您';
      note.style.display = '';
    }
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = '想認識'; }
    alert('送出失敗，請稍後再試');
  }
}

async function loadMembers(token) {
  const url = `${PUBLIC_API_URL}?action=getPublicDM&token=${encodeURIComponent(token)}`;
  const res = await fetch(url);
  const json = await res.json();
  if (!json.ok) {
    if (json.error === 'rate limit') {
      const err = new Error('rate limit');
      err.code = 'rate_limit';
      throw err;
    }
    throw new Error(json.error || 'API error');
  }
  return json.data || [];
}

function renderMembers(members) {
  // 依產業鏈分群
  const groups = {};
  members.forEach(m => {
    const k = m.industry || m.specialty || '其他';
    if (!groups[k]) groups[k] = [];
    groups[k].push(m);
  });
  const groupKeys = Object.keys(groups);
  const colorMap = {};
  groupKeys.forEach((k, i) => { colorMap[k] = CAT_COLORS[i % CAT_COLORS.length]; });

  // 填入下拉選單
  const sel = document.getElementById('jumpSelect');
  if (sel) {
    sel.innerHTML = '<option value="">跳到產業鏈...</option>' +
      groupKeys.map((k, i) => `<option value="group-${i}">${escH(k)}</option>`).join('');
    sel.style.display = groupKeys.length > 0 ? '' : 'none';
  }

  const parts = [];
  groupKeys.forEach((g, gi) => {
    const color = colorMap[g];
    parts.push(`<div class="industry-group" id="group-${gi}">
      <div class="industry-title" style="background:${color};">${escH(g)}</div>
      <div class="member-list">
        ${groups[g].map(m => {
          const photoUrl = m.photo
            ? m.photo
            : (m.gender === '男' || m.gender === 'M' ? 'default-male.png'
              : (m.gender === '女' || m.gender === 'F' ? 'default-female.png' : ''));
          return `
          <div class="member-card" data-member="${escH(m.name)}">
            ${photoUrl
              ? `<img class="mc-photo" src="${escH(photoUrl)}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
                 <div class="mc-photo-empty" style="display:none">?</div>`
              : `<div class="mc-photo-empty">?</div>`}
            <div class="mc-info">
              <div class="mc-name">${escH(m.name)}</div>
              ${m.specialty ? `<span class="mc-spec-tag" style="background:${color};">${escH(m.specialty)}</span>` : ''}
              ${m.company ? `<div class="mc-company">${escH(m.company)}</div>` : ''}
              ${m.service ? `<div class="mc-service">${escH(m.service)}</div>` : ''}
              ${m.phone ? `<div class="mc-phone"><a href="tel:${escH(m.phone.replace(/[^0-9+]/g,''))}">${escH(m.phone)}</a></div>` : ''}
              ${m.slogan ? `<div class="mc-slogan">「${escH(m.slogan)}」</div>` : ''}
              <div class="mc-btn-row">
                ${m.website ? `<a class="mc-web-btn" href="${escH(m.website)}" target="_blank" rel="noopener">看官網 &rarr;</a>` : ''}
                ${renderMeetBtn(m.name)}
              </div>
              <span class="mc-meet-note" id="note-${escAttr(m.name)}"${isMeetClicked(m.name) ? '' : ' style="display:none"'}>已通知 ${escH(m.name)}，會盡快聯繫您</span>
            </div>
          </div>
        `;
        }).join('')}
      </div>
    </div>`);
  });
  document.getElementById('content').innerHTML = parts.join('') || `<div class="empty-box">目前沒有會員資料</div>`;
}

function jumpToGroup(id) {
  if (!id) return;
  const sel = document.getElementById('jumpSelect');
  // 先取出產業名稱（清空 value 後就拿不到了）
  const industry = sel && sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].textContent.trim() : '';
  const el = document.getElementById(id);
  if (!el) return;
  const headerH = document.querySelector('.public-header').offsetHeight;
  const top = el.getBoundingClientRect().top + window.scrollY - headerH - 8;
  window.scrollTo({ top, behavior: 'smooth' });
  sel.value = '';
  // 紀錄產業鏈跳轉行為
  if (industry && industry !== '跳到產業鏈...') {
    postBehaviorEvent({ type: 'industryJump', industry, at: nowIso() });
  }
}

// 捲動超過 300px 顯示「回到頂端」按鈕
let _btnRaf = false;
window.addEventListener('scroll', () => {
  if (_btnRaf) return;
  _btnRaf = true;
  requestAnimationFrame(() => {
    const btn = document.getElementById('backToTop');
    if (btn) btn.classList.toggle('show', window.scrollY > 300);
    _btnRaf = false;
  });
}, { passive: true });

function showLoginPage() {
  return new Promise(resolve => {
    const overlay = document.createElement('div');
    overlay.className = 'login-page-overlay';
    overlay.innerHTML = `
      <div class="login-page-card">
        <div class="login-page-title">歡迎來到<br>BNI 億展白金分會</div>

        <div id="lp_form">
          <div class="login-page-label">姓名</div>
          <input class="login-page-input" id="lp_name" autocomplete="name" placeholder="請輸入您的姓名">
          <div class="login-page-label">手機</div>
          <input class="login-page-input" id="lp_phone" autocomplete="tel" inputmode="numeric" placeholder="例：0912345678">
          <div class="login-page-err" id="lp_err"></div>
          <button class="login-page-submit" id="lp_submit">進 入 會 員 介 紹</button>
        </div>

        <div id="lp_welcome" style="display:none"></div>
      </div>`;
    document.body.appendChild(overlay);
    setTimeout(() => document.getElementById('lp_name')?.focus(), 80);

    const nameEl = document.getElementById('lp_name');
    const phoneEl = document.getElementById('lp_phone');
    const errEl = document.getElementById('lp_err');
    const btn = document.getElementById('lp_submit');

    nameEl.onkeydown = (e) => { if (e.key === 'Enter') phoneEl.focus(); };
    phoneEl.onkeydown = (e) => { if (e.key === 'Enter') btn.click(); };

    btn.onclick = async () => {
      const name = nameEl.value.trim();
      const phone = phoneEl.value.trim();
      // 預覽模式：放寬驗證，允許空白
      if (!IS_PREVIEW) {
        if (!name) { errEl.textContent = '請輸入姓名'; return; }
        if (!phone || phone.replace(/\D/g,'').length < 8) { errEl.textContent = '請輸入正確的手機號碼'; return; }
      }

      btn.disabled = true; btn.textContent = IS_PREVIEW ? '進入中...' : '查詢中...';
      let matched = false, matchedName = '';
      if (!IS_PREVIEW) {
        try {
          const res = await fetch(PUBLIC_API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'lookupGuest', token: VALID_TOKEN, phone, name })
          });
          const json = await res.json();
          if (json && json.ok) { matched = !!json.matched; matchedName = json.name || ''; }
        } catch (e) { /* 沒網路也讓他進，後續按想認識時會自動建檔 */ }
        saveGuestInfo(name, phone);
      }

      // 切換到歡迎詞
      document.getElementById('lp_form').style.display = 'none';
      const wel = document.getElementById('lp_welcome');
      wel.className = 'welcome-stage';
      wel.style.display = '';
      let greeting, sub;
      if (IS_PREVIEW) {
        greeting = '預覽模式';
        sub = '畫面為來賓視角，互動按鈕已停用';
      } else {
        greeting = matched
          ? `歡迎回來，${escH(matchedName || name)}！`
          : `歡迎您，${escH(name)}！`;
        sub = matched
          ? '很開心再次見到您，請挑選感興趣的會員了解更多'
          : '正在為您準備分會會員介紹...';
      }
      wel.innerHTML = `<div class="icon">&#9733;</div><div class="big">${greeting}</div><div class="small">${sub}</div>`;

      setTimeout(() => {
        overlay.classList.add('fade-out');
        setTimeout(() => { overlay.remove(); resolve({ name, phone, matched, matchedName }); }, 400);
      }, IS_PREVIEW ? 900 : 1800);
    };
  });
}

async function ensureGuestLogin() {
  if (IS_PREVIEW) return await showLoginPage(); // 預覽模式每次都顯示登入頁
  const info = getGuestInfo();
  if (info) return info;
  return await showLoginPage();
}

(async function init() {
  const token = getToken();
  if (token !== VALID_TOKEN) {
    document.getElementById('content').innerHTML = `<div class="error-box">無效的連結<br><br>請聯絡分會取得正確的 QR Code</div>`;
    return;
  }

  // 預覽模式：加上 body class 與頂部提示條
  if (IS_PREVIEW) {
    document.body.classList.add('preview-mode');
    const banner = document.createElement('div');
    banner.className = 'preview-banner';
    banner.textContent = '預覽模式 · 互動按鈕已停用，不會紀錄任何資料';
    document.body.appendChild(banner);
  }

  // 強制登入：先取得來賓資料才能進入 DM
  await ensureGuestLogin();

  // 標記本次造訪開始
  _sessionStart = nowIso();

  try {
    const members = await loadMembers(token);
    renderMembers(members);
  } catch (e) {
    if (e.code === 'rate_limit') {
      document.getElementById('content').innerHTML = `<div class="error-box">使用人數較多，請稍候 1 分鐘再試<br><br>（系統為防止濫用設有流量保護）</div>`;
    } else {
      document.getElementById('content').innerHTML = `<div class="error-box">載入失敗，請稍後再試</div>`;
    }
  }
})();
</script>
